[package]
name = "ipc-deadline-native-validation"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
uuid = { version = "=1.26.1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_IO"] }
