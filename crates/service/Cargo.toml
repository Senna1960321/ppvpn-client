[package]
name = "ppvpn-service"
version.workspace = true
edition = "2021"
authors = ["PeakPass Labs LLC"]
description = "Privileged helper service for PPVPN transparent routing"
license = "GPL-3.0-or-later"

[[bin]]
name = "ppvpn-service"
path = "src/main.rs"

[[bin]]
name = "ppvpn-service-install"
path = "src/install.rs"

[[bin]]
name = "ppvpn-service-uninstall"
path = "src/uninstall.rs"

[dependencies]
anyhow = "1"
log = "0.4"
# Only what logfile.rs uses: without the defaults, no YAML/config parsing
# (serde_yaml and unsafe-libyaml, unmaintained; deny.toml).
log4rs = { version = "1", default-features = false, features = ["pattern_encoder", "simple_writer"] }
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
parking_lot = "0.12"
# The TUN instance runs in this process (src/core.rs).
ppvpn-core = { path = "../core" }
ppvpn-engine-host = { path = "../engine-host" }
sysinfo = "0.32"
uuid = { version = "1", features = ["v4"] }
# Silent updates (src/update.rs): the update feed's Ed25519 signature, as
# Sparkle and WinSparkle check it. Both are already in the tree (rustls).
base64 = "0.22"
ring = "0.17"

[build-dependencies]
sha2 = "0.10"

# Windows version resource on the three exes (build.rs; Windows hosts only).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
winapi = { version = "0.3", features = [
    "namedpipeapi",
    "ioapiset",
    "handleapi",
    "jobapi2",
    "winbase",
    "winnt",
    "winerror",
    "errhandlingapi",
    "accctrl",
    "aclapi",
    "securitybaseapi",
    "minwinbase",
    "processthreadsapi",
    "realtimeapiset",
    "sddl",
    "synchapi",
    "fileapi",
    "userenv",
    "winver",
    "wtsapi32",
    "guiddef",
    "softpub",
    "wincrypt",
    "windef",
    "wintrust",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework = "3"
