[package]
name = "ppvpn-core-lab"
version.workspace = true
description = "The Rust ppvpn-core behind Core API v1, for the lab and the netns CI (not a product)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ppvpn-core = { path = "../core" }
base64.workspace = true
# Match Sail's native root loader and TLS parser for the memory fixture's
# process-only trust bundle. No certificates are installed in the system.
rustls-native-certs = "=0.8.4"
btls = "0.5"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
# The versions sail resolves (Cargo.lock), so nothing is built twice.
bytes = "1"
futures-core = "0.3"
getrandom = "0.2"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }

# ne-mem's heap profile (#388): dhat's allocator in place of its counting
# one. Lab only; ci.yml's memory profile step turns it on.
dhat = { version = "0.3", optional = true }

[features]
dhat = ["dep:dhat"]

# ne-mem reads its own phys_footprint and thread count (macOS).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
