name: IPC deadline native validation
on:
  push:
    branches: [codex/validate-windows-ipc-599]
permissions:
  contents: read
jobs:
  native-pipe:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/desktop/ci/service-pipe-tests
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify production source receipt
        shell: pwsh
        run: |
          $expected = '651c74c384abb0da996bd9b7904f909ecf2a0682b6b3c04dd0d631fa4ffb5925'
          $actual = (Get-FileHash src/async_pipe.rs -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "Production source hash mismatch" }
          Write-Output "Production pipe source SHA256: $actual"
      - name: Run native and shared transaction regressions
        run: cargo test --locked -- --nocapture
      - name: Verify pending-write regression detects missing cancellation
        shell: pwsh
        run: |
          $source = Get-Content src/async_pipe.rs -Raw
          if (-not $source.Contains('windows_sys::Win32::System::IO::CancelIoEx(')) { throw "Cancellation call missing" }
          $source = $source.Replace('windows_sys::Win32::System::IO::CancelIoEx(', 'noop_cancel(')
          $source += "`n#[cfg(windows)]`nunsafe fn noop_cancel(_: windows_sys::Win32::Foundation::HANDLE, _: *const windows_sys::Win32::System::IO::OVERLAPPED) -> i32 { 0 }`n"
          Set-Content src/async_pipe.rs $source
          cargo test --locked native_pipe_deadlines_close_stalled_reads_and_writes -- --nocapture 2>&1 | Tee-Object -Variable output
          if ($LASTEXITCODE -eq 0) { throw "Regression did not detect missing write cancellation" }
          if (($output -join "`n") -notmatch 'blocked write kept the native pipe open|assertion failed: rest.len') { throw "Control failed for an unexpected reason" }
          Write-Output 'Expected failure confirmed: pending-write cancellation is required.'
          exit 0
