name: release

# What a merge to main and a release run, the repository's second workflow
# (ci.yml tests pull requests).
#
# On every push to main (a merge):
#   - the installers of the Flutter app (apps/flutter, #401; the native apps
#     no longer ship, #522), without any
#     secret: Windows (NSIS, unsigned), macOS (one DMG and .pkg per
#     architecture, ad-hoc signed) and Linux (deb and rpm), each with its
#     release metadata, as workflow artifacts; the rpm installed under dnf,
#     and the apt and dnf repositories built from the packages and installed
#     from. Nothing is published.
#   - the CLI's archives (tar.gz): Linux x86_64 and aarch64, static, and
#     macOS universal, ad-hoc signed; tools/cli/build-release.sh.
#   - the iOS app, unsigned (job ios; a stable run signs it and uploads it
#     to TestFlight instead, #470).
#   - the build caches ci.yml's jobs restore (pull requests only read
#     caches), when the merge changed what they are keyed on (Cargo.toml,
#     Cargo.lock, the toolchain, the shared actions; tools/ci-changes.sh
#     `deps`) or the key is gone (evicted): one job per ci.yml cache key.
#
# By hand (workflow_dispatch), the release itself, with one version and one
# build number for the three platforms and the CLI. The desktop app, the CLI
# and the engine share one version (the workspace's, Cargo.toml) and one
# release; the first is 0.6.0, after the Go core's last, 0.5.21:
#   stable: run on the tag vX.Y.Z (X.Y.Z at least 0.6.0), after the approval
#           of the environment desktop-release-approval. The installers are
#           built in desktop-release-stable (its signing secrets), checked as
#           a whole, published as one GitHub Release with SHA256SUMS and
#           build provenance (the CLI's archives in the same release, its
#           version checked against crates/cli), and the update site
#           (channel pointer, feeds, apt/dnf repositories) is rebuilt from
#           the releases and uploaded to its R2 bucket, served at
#           https://pkg.peakpassvpn.com (DESKTOP_SITE_BASE).
#   dev:    run on the branch main, in desktop-release-dev. Never published:
#           no release, no tag; the installers stay workflow artifacts (a dev
#           build carries the dev backend's address).
#   site:   rebuild and upload the update site from the published releases,
#           as it is, after the same approval (it signs the repositories).
#
# A stable release is refused unless the repository variable
# DESKTOP_STABLE_RELEASES is "enabled". Until then, and to try a change of
# this workflow, there is the rehearsal: a stable run on main that does
# everything a release does except what the public can see. It builds,
# signs and checks the files, makes a draft release (no tag; only the
# repository's members see a draft), and builds the update site as a
# workflow artifact instead of uploading it. Build provenance is left out of
# a rehearsal: an attestation is an entry in a public log.
#
# The Go core's releases share the tag form: v0.5.14 to v0.5.21 (its last).
# They stay as they are, and nothing here reads them: a stable release must
# be 0.6.0 or later, and the update site is built from the releases from
# v0.6.0 on. A stable release becomes the repository's "latest" release
# (unless allow_downgrade is set). The repository holds no secret itself;
# only the environments do, and a job reads them only when it runs in one.
#
# The backend every build talks to (an https origin; #517) is compiled in
# as PPVPN_API_BASE_DEFAULT: the repository variable PPVPN_API_BASE (the
# production host, public anyway) for every run but dev; for dev, the
# secret PPVPN_API_BASE of desktop-release-dev, so that the dev host stays
# masked in this public repository's logs. No address is written in the
# code or here, and a build with an empty one fails (ci-build.sh,
# tools/cli/build-release.sh). Moving the service is a change of the
# variable.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: dev or stable builds and (stable) publishes; site only rebuilds and uploads the update site
        type: choice
        options: [dev, stable, site]
        required: true
      version:
        description: Version x.y.z (dev and stable; stable runs must be on the tag v<version>, 0.6.0 or later)
        required: false
      allow_downgrade:
        description: stable only - publish even if not newer than the published release (a deliberate rollback)
        type: boolean
        default: false
      rehearsal:
        description: stable only - run the whole release without publishing anything (a draft release, no tag, no provenance, no upload of the site); on main
        type: boolean
        default: false

permissions:
  contents: read

# Merges build one at a time and a running build is never cancelled, so
# every platform's installers finish (merges come faster than the macOS and
# Windows builds); of the merges that wait, only the newest is built.
# Releases run one at a time and are never cancelled either.
concurrency:
  group: ${{ github.event_name == 'push' && 'release-main' || 'release-dispatch' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The update site (feeds, apt/dnf repositories). A build for a channel
  # updates from <site>/desktop/<channel>/appcast-<platform>.xml (macOS,
  # Windows) and <site>/linux/<channel>/latest.json (Linux; builds without
  # a channel poll stable's); the macOS and Windows builds without a
  # channel have no feed.
  PPVPN_UPDATE_SITE: ${{ vars.DESKTOP_SITE_BASE }}
  # Public half of the update feeds' key; empty disables in-app updates.
  PPVPN_SPARKLE_PUBLIC_KEY: ${{ vars.PPVPN_SPARKLE_PUBLIC_KEY }}

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
      build_number: ${{ steps.resolve.outputs.build_number }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
      environment: ${{ steps.resolve.outputs.environment }}
      package: ${{ steps.resolve.outputs.package }}
      macos: ${{ steps.resolve.outputs.macos }}
      cli_macos: ${{ steps.resolve.outputs.cli_macos }}
    steps:
      - id: resolve
        env:
          EVENT: ${{ github.event_name }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
          REHEARSAL: ${{ inputs.rehearsal }}
          STABLE_RELEASES: ${{ vars.DESKTOP_STABLE_RELEASES }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          # The last build number published before this workflow existed,
          # so that the counter never goes back (it is the fourth field of
          # the Windows file version, which updates compare).
          BUILD_OFFSET: ${{ vars.DESKTOP_BUILD_OFFSET || '0' }}
        run: |
          set -eu
          if ! printf '%s' "$BUILD_OFFSET" | grep -Eq '^[0-9]+$'; then
            echo "the variable DESKTOP_BUILD_OFFSET must be a number" >&2
            exit 1
          fi
          # One counter for every platform and channel: this workflow's run
          # number over the offset. It must only ever grow, so no other
          # workflow may publish.
          build=$((BUILD_OFFSET + RUN_NUMBER))
          if [ "$build" -gt 65535 ]; then
            echo "build number $build exceeds 65535" >&2
            exit 1
          fi
          version="" tag="" publish=false environment="" package=true
          [ "$EVENT" = push ] && CHANNEL=none
          case "$CHANNEL" in
            none)
              # A merge: test installers, no channel, the projects' version.
              ;;
            site)
              package=false
              ;;
            dev|stable)
              version=${VERSION#v}
              if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "version must be x.y.z, got '$VERSION'" >&2
                exit 1
              fi
              environment="desktop-release-$CHANNEL"
              ;;
            *) echo "unknown channel $CHANNEL" >&2; exit 1 ;;
          esac
          if [ "$CHANNEL" != stable ] && [ "$REHEARSAL" = true ]; then
            echo "a rehearsal is of the stable release" >&2
            exit 1
          fi
          case "$CHANNEL" in
            stable)
              # The Go core's releases are v0.5.21 and before, on the same
              # tag form: a stable release starts at 0.6.0.
              if [ "$(printf '%s\n' 0.6.0 "$version" | sort -V | head -n 1)" != 0.6.0 ]; then
                echo "a stable release is 0.6.0 or later (v0.5.x and older are the Go core's tags), got $version" >&2
                exit 1
              fi
              tag="v$version"
              publish=true
              if [ "$REHEARSAL" = true ]; then
                # Nothing public comes of it, so no tag: the name is only
                # what the draft release and the site's files carry.
                if [ "$REF_TYPE" != branch ] || [ "$REF_NAME" != main ]; then
                  echo "a rehearsal must run on the branch main (got $REF_TYPE $REF_NAME)" >&2
                  exit 1
                fi
              else
                if [ "$STABLE_RELEASES" != enabled ]; then
                  echo "stable releases are not enabled (variable DESKTOP_STABLE_RELEASES). Use the rehearsal to try the release." >&2
                  exit 1
                fi
                if [ "$REF_TYPE" != tag ] || [ "$REF_NAME" != "$tag" ]; then
                  echo "stable releases must run on the tag $tag (got $REF_TYPE $REF_NAME)" >&2
                  exit 1
                fi
              fi
              ;;
            dev)
              # No tag and no release: tags are public too. A second guard
              # beside the environment's own branch rule.
              if [ "$REF_TYPE" != branch ] || [ "$REF_NAME" != main ]; then
                echo "dev releases must run on the branch main (got $REF_TYPE $REF_NAME)" >&2
                exit 1
              fi
              ;;
          esac
          {
            echo "channel=$([ "$CHANNEL" = dev ] || [ "$CHANNEL" = stable ] && echo "$CHANNEL")"
            echo "version=$version"
            echo "build_number=$build"
            echo "tag=$tag"
            echo "publish=$publish"
            echo "environment=$environment"
            echo "package=$package"
            # The macOS slices (#459): a merge builds Apple silicon only, to
            # spare the macOS runners; every run by hand builds both, and so
            # does every release.
            if [ "$EVENT" = push ]; then
              echo 'macos=[{"arch":"arm64","triple":"aarch64-apple-darwin","platform":"macos-arm64"}]'
              echo "cli_macos=aarch64-apple-darwin"
            else
              echo 'macos=[{"arch":"arm64","triple":"aarch64-apple-darwin","platform":"macos-arm64"},{"arch":"x86_64","triple":"x86_64-apple-darwin","platform":"macos-x64"}]'
              echo "cli_macos=aarch64-apple-darwin x86_64-apple-darwin"
            fi
          } >>"$GITHUB_OUTPUT"
          echo "$CHANNEL ${version:-(the projects version)} build $build, tag ${tag:-none}, publish: $publish" >>"$GITHUB_STEP_SUMMARY"
          if [ "$REHEARSAL" = true ]; then
            echo "**Rehearsal**: nothing is published. No tag, no provenance, a draft release, the site as an artifact." >>"$GITHUB_STEP_SUMMARY"
          fi

  # The one approval of a stable or site run, rehearsals included: the
  # environment has the reviewers and no secret. Every job after it that
  # reads the stable environment's secrets needs this one, so none of them
  # runs unapproved. A merge and a dev run need no approval.
  approve:
    name: approve
    if: github.event_name == 'workflow_dispatch' && (inputs.channel == 'stable' || inputs.channel == 'site')
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: desktop-release-approval
    steps:
      - run: echo "approved"

  # ---- The installers: on a merge without any secret; for dev and stable
  # in the channel's environment (after the approval for stable), which
  # holds the signing secrets and the backend address. Not for a site run.

  # deb and rpm, x86_64, of the Flutter app (#401), everything native linked
  # against glibc 2.35 by building on Ubuntu 22.04 (package-linux.sh checks
  # the floor). See apps/flutter/scripts/ci-build.sh and package-linux.sh.
  linux:
    name: linux
    needs: [prepare, approve]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.package == 'true' && (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    runs-on: ubuntu-22.04
    environment: ${{ needs.prepare.outputs.environment }}
    timeout-minutes: 90
    env:
      PPVPN_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      PPVPN_VERSION: ${{ needs.prepare.outputs.version }}
      PPVPN_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      NFPM_VERSION: '2.47.0'
      PPVPN_API_BASE_DEFAULT: ${{ needs.prepare.outputs.channel == 'dev' && secrets.PPVPN_API_BASE || needs.prepare.outputs.channel != 'dev' && vars.PPVPN_API_BASE || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-gnu
      - name: Install build and packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config \
            libgtk-3-dev libx11-dev libxi-dev
          curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: ./.github/actions/flutter-toolchain
      # The crates from the cache; Cargo offline from here (#459).
      - uses: ./.github/actions/cargo-home
      # A test-only cargo feature (fault injection, test runtime, lab hooks)
      # never ships: the release graph is refused if one is on.
      - name: No test-only features
        run: |
          tools/release-features-check.sh --target x86_64-unknown-linux-gnu -p ppvpn-flutter -p ppvpn-push-agent
          tools/release-features-check.sh --target x86_64-unknown-linux-gnu --manifest-path crates/service/Cargo.toml
      - id: build
        name: Build the app
        run: apps/flutter/scripts/ci-build.sh
      - name: Build packages
        run: apps/flutter/scripts/package-linux.sh "${{ steps.build.outputs.bundle }}"
      # ppvpn-archive-keyring (deb) and ppvpn-release (rpm), which set the
      # package repository up on a user's machine.
      - name: Build repository setup packages
        run: apps/flutter/scripts/build-repo-packages.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: desktop-linux
          if-no-files-found: error
          # A release run's packages are not kept long: a stable build's are in the
          # release, a dev build's are for testing. Other builds: the default.
          retention-days: ${{ needs.prepare.outputs.environment && 3 || 0 }}
          path: |
            dist/linux/*.deb
            dist/linux/*.rpm
            dist/linux/release-meta-linux-*.json

  # The deb and the rpm, each installed alone, started once and removed
  # (apps/flutter/scripts/package-smoke.sh), in the images ci.yml uses
  # (apps/flutter/packaging/linux/smoke-images.sh); the deb also upgrades the
  # native app's last release in place, as in ci.yml. What the checks install
  # comes from the caches ci.yml restores, not the mirrors: saved here, on
  # main, where the pull requests' runs can read them.
  linux-smoke:
    name: linux-smoke
    needs: [prepare, linux]
    # Explicit: the implicit success() also looks at approve, which a push skips.
    if: ${{ !cancelled() && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # As in ci.yml's flutter job, and in the deb cache's key.
      NATIVE_TAG: v0.6.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            apps/flutter/scripts
            apps/flutter/packaging/linux
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-linux
          path: dist
      # Downloaded and checked only: package-smoke.sh installs it.
      - name: Fetch the native app's deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deb="PPVPN-${NATIVE_TAG#v}-linux-x64.deb"
          gh release download "$NATIVE_TAG" --repo "$GITHUB_REPOSITORY" -p "$deb" -p SHA256SUMS -D native
          (cd native && grep " $deb\$" SHA256SUMS | sha256sum -c -)
      - name: Smoke packages (deb)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/smoke-pkgs/deb
          key: linux-smoke-deb-v1-native-${{ env.NATIVE_TAG }}-${{ hashFiles('apps/flutter/scripts/package-smoke.sh', 'apps/flutter/packaging/linux/nfpm.yaml', 'apps/flutter/packaging/linux/smoke-images.sh') }}
      - name: Smoke packages (rpm)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/smoke-pkgs/rpm
          key: linux-smoke-rpm-v1-${{ hashFiles('apps/flutter/scripts/package-smoke.sh', 'apps/flutter/packaging/linux/nfpm.yaml', 'apps/flutter/packaging/linux/smoke-images.sh') }}
      # The app only: ppvpn-release would enable the (production) repository.
      - name: Install, start and remove the x64 deb and rpm
        run: |
          source apps/flutter/packaging/linux/smoke-images.sh
          smoke() {
            mkdir -p "$RUNNER_TEMP/smoke-pkgs/$1"
            docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/smoke-pkgs/$1:/smoke-pkgs" \
              -e PPVPN_SMOKE_PKGS=/smoke-pkgs -w /src "$2" \
              bash apps/flutter/scripts/package-smoke.sh "${@:3}"
          }
          deb=(dist/PPVPN-*-linux-x64.deb)
          rpm=(dist/PPVPN-*-linux-x64.rpm)
          smoke deb "$SMOKE_IMAGE_DEB" "${deb[0]}" "native/PPVPN-${NATIVE_TAG#v}-linux-x64.deb"
          smoke rpm "$SMOKE_IMAGE_RPM" "${rpm[0]}"

  # The apt and dnf repositories the site serves, built from these packages
  # as from release assets and installed from with real apt and dnf. No
  # secret: a key made here signs them. The site and the release downloads
  # are served from the runner (tools/desktop/ci/repo-selftest-server.py);
  # a download answers 302, as a GitHub Release's does, and the rpm is only
  # reachable that way.
  linux-repo:
    name: linux-repo
    needs: [prepare, linux]
    # Explicit: the implicit success() also looks at approve, which a push skips.
    if: ${{ !cancelled() && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      REPO_PORT: '18080'
      REPO_URL: http://127.0.0.1:18080
      # build-linux-repo.sh refuses bases that are not https, except for this test.
      PKG_ALLOW_HTTP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            tools/desktop/ci
            apps/flutter/packaging/linux
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-linux
          path: dist
      - name: Install repository tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends apt-utils createrepo-c rpm gpgv jq
      - name: Make a throwaway signing key
        run: |
          export GNUPGHOME="$RUNNER_TEMP/selftest-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          cat >"$GNUPGHOME/key.conf" <<'EOF'
          %no-protection
          Key-Type: RSA
          Key-Length: 4096
          Key-Usage: sign
          Name-Real: PPVPN repository self-test
          Name-Email: selftest@example.com
          Expire-Date: 0
          %commit
          EOF
          gpg --batch --quiet --generate-key "$GNUPGHOME/key.conf"
          fingerprint="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1=="fpr"{print $10; exit}')"
          [[ "$fingerprint" =~ ^[0-9A-F]{40}$ ]]
          gpg --batch --armor --export-secret-keys "$fingerprint" >"$GNUPGHOME/secret.asc"
          # Worth nothing, but every later step would print it with its environment.
          while IFS= read -r line; do
            if [ "${#line}" -ge 16 ] && [[ "$line" != -----* ]]; then echo "::add-mask::$line"; fi
          done <"$GNUPGHOME/secret.asc"
          {
            echo "PKG_GPG_FINGERPRINT=$fingerprint"
            echo "PKG_GPG_PRIVATE_KEY<<PPVPN_SELFTEST_KEY_END"
            cat "$GNUPGHOME/secret.asc"
            echo "PPVPN_SELFTEST_KEY_END"
          } >>"$GITHUB_ENV"
          gpgconf --kill all
          rm -rf "$GNUPGHOME"
      - name: Lay the packages out as releases and sign the rpms
        run: |
          T="$RUNNER_TEMP/linux-repo"
          deb_meta=dist/release-meta-linux-x64-deb.json
          rpm_meta=dist/release-meta-linux-x64-rpm.json
          version="$(jq -er .version "$deb_meta")"
          build="$(jq -er .build "$deb_meta")"
          stable_tag="v$version"
          dev_tag="v$version-dev.${build##*.}"
          stable="$T/releases/stable/$stable_tag"
          dev="$T/releases/dev/$dev_tag"
          mkdir -p "$stable" "$T/releases/dev" "$T/assets" "$T/site/desktop"
          cp dist/*.deb dist/*.rpm dist/release-meta-linux-*.json "$stable/"
          # A pull request's build records no channel, and a release's records
          # its own: in this copy only, the packages are called a stable
          # release, and below a dev one.
          channel() {
            for meta in "$2"/release-meta-linux-x64-deb.json "$2"/release-meta-linux-x64-rpm.json; do
              jq --arg channel "$1" '.channel = $channel' "$meta" >"$meta.part"
              mv "$meta.part" "$meta"
            done
          }
          channel stable "$stable"

          rpm_file="$(jq -er .file "$rpm_meta")"
          unsigned="$(sha256sum "$stable/$rpm_file" | cut -d' ' -f1)"
          tools/desktop/ci/sign-linux-rpms.sh "$stable"
          signed="$(sha256sum "$stable/$rpm_file" | cut -d' ' -f1)"
          test "$signed" != "$unsigned"
          test "$(jq -er .sha256 "$stable/release-meta-linux-x64-rpm.json")" = "$signed"
          test "$(jq -er .length "$stable/release-meta-linux-x64-rpm.json")" = "$(wc -c <"$stable/$rpm_file" | tr -d ' ')"
          test "$(jq -er .channel "$stable/release-meta-linux-x64-rpm.json")" = stable
          # A second run leaves a signed release as it is.
          tools/desktop/ci/sign-linux-rpms.sh "$stable"
          test "$(sha256sum "$stable/$rpm_file" | cut -d' ' -f1)" = "$signed"
          # Another key is refused an rpm that is already signed, and leaves it as it is.
          (
            export GNUPGHOME="$RUNNER_TEMP/other-gnupg"
            mkdir -m 700 "$GNUPGHOME"
            gpg --batch --quiet --passphrase '' --quick-generate-key \
              'PPVPN repository self-test (another key) <other@example.com>' rsa2048 sign never
            other="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1=="fpr"{print $10; exit}')"
            PKG_GPG_PRIVATE_KEY="$(gpg --batch --armor --export-secret-keys "$other")"
            gpgconf --kill all
            rm -rf "$GNUPGHOME"
            unset GNUPGHOME
            export PKG_GPG_PRIVATE_KEY PKG_GPG_FINGERPRINT="$other"
            if tools/desktop/ci/sign-linux-rpms.sh "$stable" 2>"$T/refusal"; then
              echo "an rpm signed by another key was signed again" >&2; exit 1
            fi
            cat "$T/refusal"
            grep -q 'already signed by another key' "$T/refusal"
          )
          test "$(sha256sum "$stable/$rpm_file" | cut -d' ' -f1)" = "$signed"

          # The same packages as a dev release.
          cp -R "$stable" "$dev"
          channel dev "$dev"
          ln -s "$stable" "$T/assets/$stable_tag"
          ln -s "$dev" "$T/assets/$dev_tag"
          # Another part of the site, which the repositories' build must leave alone.
          echo other >"$T/site/desktop/other"
          {
            echo "T=$T"
            echo "STABLE_TAG=$stable_tag"
            echo "DEV_TAG=$dev_tag"
            echo "RPM_FILE=$rpm_file"
          } >>"$GITHUB_ENV"
      - name: Build both channels into one site
        run: |
          build() {   # channel, releases, out
            tools/desktop/ci/build-linux-repo.sh --channel "$1" --releases "$2" \
              --download-base "$REPO_URL/download" --site-base "$REPO_URL" --out "$3" --keep 5
          }
          # Refusals write nothing: an http base without the test switch, and
          # releases of another channel.
          if env -u PKG_ALLOW_HTTP tools/desktop/ci/build-linux-repo.sh --channel stable \
               --releases "$T/releases/stable" --download-base "$REPO_URL/download" \
               --site-base "$REPO_URL" --out "$T/refused"; then
            echo "an http base was accepted" >&2; exit 1
          fi
          if build dev "$T/releases/stable" "$T/refused"; then
            echo "stable releases were accepted as dev" >&2; exit 1
          fi
          test ! -e "$T/refused"

          stable_files() {
            (cd "$T/site" && find linux/apt/dists/stable linux/apt/pool linux/rpm/stable linux/stable \
              -type f -exec sha256sum {} + | sort -k2)
          }
          build stable "$T/releases/stable" "$T/site"
          stable_files >"$T/stable.before"
          test -s "$T/stable.before"
          build dev "$T/releases/dev" "$T/site"
          stable_files >"$T/stable.after"
          diff -u "$T/stable.before" "$T/stable.after"

          cd "$T/site"
          test "$(cat desktop/other)" = other
          deb="$(ls linux/apt/pool/main/p/ppvpn/)"
          test "$(echo "$deb" | wc -l)" = 1    # the two channels share one pool file
          for channel in stable dev; do
            for file in InRelease Release Release.gpg main/binary-amd64/Packages \
                        main/binary-amd64/Packages.gz main/binary-amd64/Packages.xz; do
              test -s "linux/apt/dists/$channel/$file"
            done
            test -d "linux/apt/dists/$channel/main/binary-amd64/by-hash/SHA256"
            test -d "linux/apt/dists/$channel/main/binary-amd64/by-hash/SHA512"
            grep -qxF "Filename: pool/main/p/ppvpn/$deb" "linux/apt/dists/$channel/main/binary-amd64/Packages"
            test -s "linux/rpm/$channel/x86_64/repodata/repomd.xml"
            test -s "linux/rpm/$channel/x86_64/repodata/repomd.xml.asc"
            test -z "$(find "linux/rpm/$channel" -name '*.rpm')"    # referenced, not hosted
            jq -e --arg channel "$channel" '.schema == 1 and .channel == $channel' "linux/$channel/latest.json"
          done
          for file in ppvpn.asc ppvpn-archive-keyring.deb ppvpn-archive-keyring.deb.asc \
                      ppvpn-release.rpm ppvpn-release.rpm.asc; do
            test -s "linux/$file"
          done
          test "$(ls linux/setup | wc -l)" = 4
          # Without --published the setup packages are the release's own.
          for setup in linux/setup/*.deb linux/setup/*.rpm; do
            cmp "$setup" "$T/releases/stable/$STABLE_TAG/$(basename "$setup")"
          done
          cat linux/stable/latest.json
          jq -e --arg build "$(jq -er .build "$GITHUB_WORKSPACE/dist/release-meta-linux-x64-deb.json")" \
            --arg deb_url "$REPO_URL/linux/apt/pool/main/p/ppvpn/$deb" \
            --arg deb_sha "$(sha256sum "linux/apt/pool/main/p/ppvpn/$deb" | cut -d' ' -f1)" \
            --arg rpm_url "$REPO_URL/download/$STABLE_TAG/$RPM_FILE" \
            --arg rpm_sha "$(sha256sum "$T/releases/stable/$STABLE_TAG/$RPM_FILE" | cut -d' ' -f1)" \
            --argjson rpm_size "$(wc -c <"$T/releases/stable/$STABLE_TAG/$RPM_FILE" | tr -d ' ')" \
            '.build == $build and .deb.url == $deb_url and .deb.sha256 == $deb_sha
              and .rpm.file == env.RPM_FILE and .rpm.url == $rpm_url and .rpm.sha256 == $rpm_sha
              and .rpm.size == $rpm_size' linux/stable/latest.json
          jq -e --arg rpm_url "$REPO_URL/download/$DEV_TAG/$RPM_FILE" '.rpm.url == $rpm_url' linux/dev/latest.json
      # What a release does: the production key has a passphrase, handed to
      # gpg and to rpmsign through a loopback pinentry. A second key made
      # here, with a random passphrase, signs a fresh copy of the unsigned
      # packages and a site of its own. Without the passphrase, or with a
      # wrong one, the scripts must refuse before touching anything, and at
      # once: a script that waited to be given one would hang a release.
      - name: Sign and build with a passphrase-protected key
        run: |
          P="$T/passphrase"
          release="$P/releases/$STABLE_TAG"
          mkdir -p "$release"
          # dist/ still holds the packages as built: unsigned.
          cp dist/*.deb dist/*.rpm dist/release-meta-linux-*.json "$release/"
          for meta in "$release"/release-meta-linux-x64-deb.json "$release"/release-meta-linux-x64-rpm.json; do
            jq '.channel = "stable"' "$meta" >"$meta.part"
            mv "$meta.part" "$meta"
          done
          rpm_meta="$release/release-meta-linux-x64-rpm.json"
          digest() { sha256sum "$1" | cut -d' ' -f1; }
          unsigned="$(digest "$release/$RPM_FILE")"
          test "$unsigned" = "$(jq -er .sha256 dist/release-meta-linux-x64-rpm.json)"

          passphrase="$(openssl rand -hex 24)"
          echo "::add-mask::$passphrase"
          wrong="$(openssl rand -hex 24)"
          echo "::add-mask::$wrong"
          test "${#passphrase}" = 48
          test "$passphrase" != "$wrong"

          export GNUPGHOME="$RUNNER_TEMP/passphrase-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$passphrase" >"$GNUPGHOME/passphrase"
          cat >"$GNUPGHOME/key.conf" <<EOF
          Key-Type: RSA
          Key-Length: 4096
          Key-Usage: sign
          Name-Real: PPVPN repository passphrase self-test
          Name-Email: passphrase@example.com
          Expire-Date: 0
          Passphrase: $passphrase
          %commit
          EOF
          gpg --batch --quiet --generate-key "$GNUPGHOME/key.conf"
          fingerprints="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1=="fpr"{print $10}')"
          fingerprint="$(head -n 1 <<<"$fingerprints")"
          [[ "$fingerprint" =~ ^[0-9A-F]{40}$ ]]
          test "$fingerprint" != "$PKG_GPG_FINGERPRINT"
          # Kept in this step's shell only: never in the environment file, so never printed.
          key="$(gpg --batch --pinentry-mode loopback --passphrase-file "$GNUPGHOME/passphrase" \
            --armor --export-secret-keys "$fingerprint")"
          [[ "$key" == *"PRIVATE KEY BLOCK"* ]]
          gpg --batch --armor --export "$fingerprint" >"$P/key.asc"
          gpg --batch --export "$fingerprint" >"$P/keyring.gpg"
          test -s "$P/key.asc"
          test -s "$P/keyring.gpg"
          gpgconf --kill all
          rm -rf "$GNUPGHOME"
          unset GNUPGHOME

          with_key() {   # passphrase, command...
            PKG_GPG_PRIVATE_KEY="$key" PKG_GPG_FINGERPRINT="$fingerprint" PKG_GPG_PASSPHRASE="$1" "${@:2}"
          }
          build() {   # passphrase, out
            with_key "$1" tools/desktop/ci/build-linux-repo.sh --channel stable --releases "$P/releases" \
              --download-base "$REPO_URL/download" --site-base "$REPO_URL" --out "$2"
          }

          # A refusal: not a success, not the timeout (124, or 137 once killed), and
          # the script's own message about the passphrase.
          refused() {   # exit status, what the message says about the passphrase
            cat "$P/refusal" >&2
            case "$1" in
              0|124|137) echo "expected a prompt refusal, got exit status $1" >&2; exit 1 ;;
            esac
            if ! grep -q "the signing key cannot be used: PKG_GPG_PASSPHRASE is $2" "$P/refusal"; then
              echo "the refusal does not say the passphrase is $2" >&2; exit 1
            fi
          }
          as_built() {
            test "$(digest "$release/$RPM_FILE")" = "$unsigned"
            test "$(jq -er .sha256 "$rpm_meta")" = "$unsigned"
            test "$(jq -er .length "$rpm_meta")" = "$(jq -er .length dist/release-meta-linux-x64-rpm.json)"
          }

          # No passphrase, unset and then empty: nothing is signed, the rpm and its
          # metadata stay as built.
          status=0
          PKG_GPG_PRIVATE_KEY="$key" PKG_GPG_FINGERPRINT="$fingerprint" timeout -k 5 60 \
            env -u PKG_GPG_PASSPHRASE tools/desktop/ci/sign-linux-rpms.sh "$release" 2>"$P/refusal" || status=$?
          refused "$status" missing
          as_built
          status=0
          PKG_GPG_PRIVATE_KEY="$key" PKG_GPG_FINGERPRINT="$fingerprint" PKG_GPG_PASSPHRASE='' timeout -k 5 60 \
            tools/desktop/ci/sign-linux-rpms.sh "$release" 2>"$P/refusal" || status=$?
          refused "$status" missing
          as_built

          # The wrong passphrase: the same.
          status=0
          with_key "$wrong" timeout -k 5 60 tools/desktop/ci/sign-linux-rpms.sh "$release" 2>"$P/refusal" || status=$?
          refused "$status" wrong
          as_built

          # The right one: signed, verifiable with the key's public half, metadata rewritten.
          with_key "$passphrase" tools/desktop/ci/sign-linux-rpms.sh "$release"
          signed="$(digest "$release/$RPM_FILE")"
          test "$signed" != "$unsigned"
          test "$(jq -er .sha256 "$rpm_meta")" = "$signed"
          test "$(jq -er .length "$rpm_meta")" = "$(wc -c <"$release/$RPM_FILE" | tr -d ' ')"
          mkdir "$P/rpmdb"
          rpm --dbpath "$P/rpmdb" --import "$P/key.asc"
          for rpm in "$release/$RPM_FILE" "$release"/ppvpn-release-*.noarch.rpm; do
            verdict="$(rpm --dbpath "$P/rpmdb" -K "$rpm")"
            echo "$verdict"
            grep -q 'digests signatures OK' <<<"$verdict"
          done

          # The repositories: no passphrase, or the wrong one, leaves no output directory.
          status=0
          PKG_GPG_PRIVATE_KEY="$key" PKG_GPG_FINGERPRINT="$fingerprint" timeout -k 5 60 \
            env -u PKG_GPG_PASSPHRASE tools/desktop/ci/build-linux-repo.sh --channel stable \
            --releases "$P/releases" --download-base "$REPO_URL/download" --site-base "$REPO_URL" \
            --out "$P/refused" 2>"$P/refusal" || status=$?
          refused "$status" missing
          test ! -e "$P/refused"
          status=0
          build "$wrong" "$P/refused" 2>"$P/refusal" || status=$?
          refused "$status" wrong
          test ! -e "$P/refused"
          build "$passphrase" "$P/site"
          dist_dir="$P/site/linux/apt/dists/stable"
          repodata="$P/site/linux/rpm/stable/x86_64/repodata"
          gpgv --keyring "$P/keyring.gpg" "$dist_dir/InRelease"
          gpgv --keyring "$P/keyring.gpg" "$dist_dir/Release.gpg" "$dist_dir/Release"
          gpgv --keyring "$P/keyring.gpg" "$repodata/repomd.xml.asc" "$repodata/repomd.xml"
          published="$(gpg --batch --show-keys --with-colons "$P/site/linux/ppvpn.asc" | awk -F: '$1=="fpr"{print $10}')"
          test "$(head -n 1 <<<"$published")" = "$fingerprint"
          jq -e --arg sha "$signed" '.rpm.sha256 == $sha' "$P/site/linux/stable/latest.json"
      - name: Serve the site and the downloads
        run: |
          nohup python3 tools/desktop/ci/repo-selftest-server.py --port "$REPO_PORT" \
            --site "$T/site" --assets "$T/assets" >"$T/server.out" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "$REPO_URL/linux/ppvpn.asc"; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null "$REPO_URL/linux/ppvpn.asc"
          # A download is a redirect, and the signed rpm is at its end.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$REPO_URL/download/$STABLE_TAG/$RPM_FILE")" = 302
          test "$(curl -fsSL "$REPO_URL/download/$STABLE_TAG/$RPM_FILE" | sha256sum | cut -d' ' -f1)" \
            = "$(jq -er .sha256 "$T/releases/stable/$STABLE_TAG/release-meta-linux-x64-rpm.json")"
          # packaging/ppvpn.list and ppvpn.repo, as the setup packages install
          # them, with the site's address replaced by this server's.
          sed "s#https://pkg.peakpassvpn.com#$REPO_URL#g" apps/flutter/packaging/linux/ppvpn.list >"$T/ppvpn.list"
          sed "s#https://pkg.peakpassvpn.com#$REPO_URL#g" apps/flutter/packaging/linux/ppvpn.repo >"$T/ppvpn.repo"
          grep -qxF "deb [signed-by=/usr/share/keyrings/ppvpn-archive-keyring.gpg] $REPO_URL/linux/apt stable main" "$T/ppvpn.list"
          grep -qxF "baseurl=$REPO_URL/linux/rpm/stable/\$basearch" "$T/ppvpn.repo"
          grep -qx 'gpgcheck=1' "$T/ppvpn.repo"
          grep -qx 'repo_gpgcheck=1' "$T/ppvpn.repo"
          gpg --batch --dearmor <"$T/site/linux/ppvpn.asc" >"$T/ppvpn-archive-keyring.gpg"
          chmod 644 "$T/ppvpn-archive-keyring.gpg" "$T/ppvpn.list" "$T/ppvpn.repo" "$T/site/linux/ppvpn.asc"
      # What a release after the first does: the release rpm is signed anew
      # (another signature time, so other bytes under the same name), and the
      # site keeps the setup packages it already serves (--published), which
      # are immutable there.
      - name: A later release keeps the published setup packages
        run: |
          setup_rpm="$(cd "$T/site/linux/setup" && ls ppvpn-release-*.noarch.rpm)"
          later="$T/later/releases/$STABLE_TAG"
          mkdir -p "$T/later/releases"
          cp -R "$T/releases/stable/$STABLE_TAG" "$later"
          sleep 2   # a signature's time is in seconds
          rpmsign --delsign "$later/$setup_rpm" >/dev/null
          tools/desktop/ci/sign-linux-rpms.sh "$later"
          if cmp -s "$later/$setup_rpm" "$T/site/linux/setup/$setup_rpm"; then
            echo "signing again did not change the setup rpm" >&2; exit 1
          fi
          build() {   # out, extra arguments
            tools/desktop/ci/build-linux-repo.sh --channel stable --releases "$T/later/releases" \
              --download-base "$REPO_URL/download" --site-base "$REPO_URL" --out "$1" --keep 5 "${@:2}"
          }
          build "$T/later/site" --published "$REPO_URL" 2>"$T/later/build.err"
          cat "$T/later/build.err"
          # The site's copy was read (over HTTP from the test server) and kept.
          grep -q "keep the published linux/setup/$setup_rpm" "$T/later/build.err"
          # --published must be a URL: a bare word is refused.
          if build "$T/later/not-a-url" --published not-a-url 2>/dev/null; then
            echo "--published accepted a value that is not a URL" >&2; exit 1
          fi
          for name in "$setup_rpm" "$(cd "$T/site/linux/setup" && ls ppvpn-archive-keyring_*_all.deb)"; do
            cmp "$T/later/site/linux/setup/$name" "$T/site/linux/setup/$name"
          done
          cmp "$T/later/site/linux/ppvpn-release.rpm" "$T/site/linux/setup/$setup_rpm"
          # Without --published the release's own copy is used.
          build "$T/later/fresh"
          cmp "$T/later/fresh/linux/setup/$setup_rpm" "$later/$setup_rpm"
          # A published file of another package under the name is refused.
          cp "$T/site/linux/setup/$setup_rpm" "$T/later/saved.rpm"
          cp "$T/later/releases/$STABLE_TAG/$RPM_FILE" "$T/site/linux/setup/$setup_rpm"
          if build "$T/later/refused" --published "$REPO_URL" 2>"$T/later/refusal"; then
            echo "another package under the setup rpm's name was accepted" >&2; exit 1
          fi
          cp "$T/later/saved.rpm" "$T/site/linux/setup/$setup_rpm"
          cat "$T/later/refusal"
          grep -q 'is another package than the release' "$T/later/refusal"
      - name: Install with apt (Ubuntu 22.04)
        run: |
          deb="$(ls "$T/site/linux/apt/pool/main/p/ppvpn/"*.deb)"
          expected="$(dpkg-deb -f "$deb" Version)"
          seen="$(wc -l <"$T/server.out")"
          docker run --rm --network host \
            -v "$T/ppvpn-archive-keyring.gpg:/usr/share/keyrings/ppvpn-archive-keyring.gpg:ro" \
            -v "$T/ppvpn.list:/etc/apt/sources.list.d/ppvpn.list:ro" \
            -e DEBIAN_FRONTEND=noninteractive -e EXPECTED="$expected" \
            ubuntu:22.04 bash -euxc '
              apt-get update
              apt-cache policy ppvpn
              apt-get install -y --no-install-recommends ppvpn
              test "$(dpkg-query -W -f "\${Version}" ppvpn)" = "$EXPECTED"
              test -x /usr/lib/ppvpn/ppvpn
            '
          # What apt asked this server for.
          tail -n "+$((seen + 1))" "$T/server.out" >"$T/apt.requests"
          grep -E '"GET /linux/apt/dists/stable/InRelease HTTP/[0-9.]+" 200 ' "$T/apt.requests"
          grep -E '"GET /linux/apt/pool/main/p/ppvpn/[^ ]+\.deb HTTP/[0-9.]+" 200 ' "$T/apt.requests"
      - name: Install with dnf (Fedora)
        run: |
          rpm="$T/releases/stable/$STABLE_TAG/$RPM_FILE"
          expected="$(rpm -qp --nosignature --qf '%{VERSION}-%{RELEASE}' "$rpm")"
          test "${expected%%-*}" = "$(jq -er .version dist/release-meta-linux-x64-rpm.json)"
          seen="$(wc -l <"$T/server.out")"
          docker run --rm --network host \
            -v "$T/site/linux/ppvpn.asc:/etc/pki/rpm-gpg/RPM-GPG-KEY-ppvpn:ro" \
            -v "$T/ppvpn.repo:/etc/yum.repos.d/ppvpn.repo:ro" \
            -e EXPECTED="$expected" \
            fedora:latest bash -euxc '
              rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-ppvpn
              dnf -y --repo ppvpn makecache
              dnf install -y ppvpn
              test "$(rpm -q --qf "%{VERSION}-%{RELEASE}" ppvpn)" = "$EXPECTED"
              test -x /usr/lib/ppvpn/ppvpn
            '
          # dnf fetched the rpm where the metadata's xml:base sent it, through the redirect.
          tail -n "+$((seen + 1))" "$T/server.out" >"$T/dnf.requests"
          grep -E '"GET /linux/rpm/stable/x86_64/repodata/repomd\.xml\.asc HTTP/[0-9.]+" 200 ' "$T/dnf.requests"
          grep -E "\"GET /download/$STABLE_TAG/[^ ]+\.rpm HTTP/[0-9.]+\" 302 " "$T/dnf.requests"
          grep -E "\"GET /assets/$STABLE_TAG/[^ ]+\.rpm HTTP/[0-9.]+\" 200 " "$T/dnf.requests"
      - name: Requests served
        if: always()
        run: cat "$RUNNER_TEMP/linux-repo/server.out" 2>/dev/null || true

  # The NSIS installer. See apps/flutter/README.md ("Windows installer"). Three jobs
  # (#459): the service's profile shares no build with the app's release
  # build, so it compiles beside it, and the packaging job compiles nothing:
  #   windows-app      the app (apps/flutter/scripts/ci-build.sh), with the
  #                    push agent in the same cargo invocation; it needs the
  #                    backend's address, so the environment
  #   windows-service  the service helpers (package-windows.ps1 -ServiceOnly);
  #                    the environment only tells whether the release is
  #                    signed, which the service is built for
  #   windows          package-windows.ps1 signs and packages the two
  windows-app:
    name: windows-app
    needs: [prepare, approve]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.package == 'true' && (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    runs-on: windows-latest
    environment: ${{ needs.prepare.outputs.environment }}
    timeout-minutes: 120
    env:
      PPVPN_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      PPVPN_VERSION: ${{ needs.prepare.outputs.version }}
      PPVPN_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      PPVPN_API_BASE_DEFAULT: ${{ needs.prepare.outputs.channel == 'dev' && secrets.PPVPN_API_BASE || needs.prepare.outputs.channel != 'dev' && vars.PPVPN_API_BASE || '' }}
      # bindgen's libclang (btls-sys), from the runner's LLVM.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    defaults:
      run:
        shell: bash
    steps:
      - name: LF checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          targets: x86_64-pc-windows-msvc
      - uses: ./.github/actions/flutter-toolchain
      # The crates from the cache; Cargo offline from here (#459).
      - uses: ./.github/actions/cargo-home
      # A test-only cargo feature (fault injection, test runtime, lab hooks)
      # never ships: the release graph is refused if one is on.
      - name: No test-only features
        run: tools/release-features-check.sh --target x86_64-pc-windows-msvc -p ppvpn-flutter -p ppvpn-push-agent
      - name: Build the app
        run: apps/flutter/scripts/ci-build.sh
      # The bundle at its default path and the push agent, at their paths in
      # the workspace (the artifact keeps them relative to its root).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: windows-app
          if-no-files-found: error
          retention-days: 1
          path: |
            apps/flutter/build/windows/x64/runner/Release
            target/release/ppvpn-push-agent.exe

  windows-service:
    name: windows-service
    needs: [prepare, approve]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.package == 'true' && (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    runs-on: windows-latest
    environment: ${{ needs.prepare.outputs.environment }}
    timeout-minutes: 90
    env:
      PPVPN_VERSION: ${{ needs.prepare.outputs.version }}
      PPVPN_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      # What package-windows.ps1 derives in the windows job, which checks it
      # against this: 0 when Artifact Signing signs (the windows job's
      # ARTIFACT_SIGNING) and the publisher pin is set (#489).
      PPVPN_WINDOWS_ALLOW_UNSIGNED_CLIENT: ${{ needs.prepare.outputs.environment && vars.AZURE_CLIENT_ID && vars.AZURE_TENANT_ID && vars.AZURE_SUBSCRIPTION_ID && vars.ARTIFACT_SIGNING_ENDPOINT && vars.ARTIFACT_SIGNING_ACCOUNT && vars.ARTIFACT_SIGNING_PROFILE && vars.PPVPN_WINDOWS_PUBLISHER_EKU && '0' || '1' }}
      PPVPN_WINDOWS_PUBLISHER_EKU: ${{ vars.PPVPN_WINDOWS_PUBLISHER_EKU }}
      PPVPN_WINDOWS_NEXT_PUBLISHER_EKU: ${{ vars.PPVPN_WINDOWS_NEXT_PUBLISHER_EKU }}
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    defaults:
      run:
        shell: bash
    steps:
      - name: LF checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          targets: x86_64-pc-windows-msvc
      # The crates from the cache; Cargo offline from here (#459).
      - uses: ./.github/actions/cargo-home
      - name: No test-only features
        run: tools/release-features-check.sh --target x86_64-pc-windows-msvc --manifest-path crates/service/Cargo.toml
      - name: Build the service helpers
        shell: powershell
        run: apps/flutter/scripts/package-windows.ps1 -ServiceOnly
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: windows-service
          if-no-files-found: error
          retention-days: 1
          path: build/windows-service

  windows:
    name: windows
    needs: [prepare, approve, windows-app, windows-service]
    if: >-
      !cancelled() && needs.windows-app.result == 'success' && needs.windows-service.result == 'success'
    runs-on: windows-latest
    environment: ${{ needs.prepare.outputs.environment }}
    timeout-minutes: 60
    permissions:
      contents: read
      # azure/login's OIDC token, for Artifact Signing.
      id-token: write
    env:
      PPVPN_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      PPVPN_VERSION: ${{ needs.prepare.outputs.version }}
      PPVPN_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      SPARKLE_PRIVATE_KEY: ${{ needs.prepare.outputs.environment && secrets.SPARKLE_PRIVATE_KEY || '' }}
      # Authenticode through Azure Artifact Signing (#489,
      # tools/desktop/ci/artifact-signing.ps1): in a release environment
      # with all of its variables (docs/release.md), else unsigned.
      ARTIFACT_SIGNING: ${{ needs.prepare.outputs.environment && vars.AZURE_CLIENT_ID && vars.AZURE_TENANT_ID && vars.AZURE_SUBSCRIPTION_ID && vars.ARTIFACT_SIGNING_ENDPOINT && vars.ARTIFACT_SIGNING_ACCOUNT && vars.ARTIFACT_SIGNING_PROFILE && 'true' || '' }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
      # The service's publisher pin: the signer's identity EKU, read from the
      # first signed build's log (check-publisher.ps1). Until it is set the
      # service accepts its client unchecked, as an unsigned build's.
      PPVPN_WINDOWS_PUBLISHER_EKU: ${{ vars.PPVPN_WINDOWS_PUBLISHER_EKU }}
      PPVPN_WINDOWS_NEXT_PUBLISHER_EKU: ${{ vars.PPVPN_WINDOWS_NEXT_PUBLISHER_EKU }}
    defaults:
      run:
        shell: bash
    steps:
      - name: LF checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # NSIS from a pinned, checksummed installer, not Chocolatey's feed.
      - name: NSIS
        uses: ./.github/actions/nsis
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-app
          path: .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-service
          path: build/windows-service
      # The signing client signs as the Azure CLI's login: the Entra app's
      # federated credential for this environment, which holds the
      # certificate profile's signer role.
      - name: Sign in to Azure
        if: env.ARTIFACT_SIGNING == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Set up Artifact Signing
        if: env.ARTIFACT_SIGNING == 'true'
        shell: powershell
        run: tools/desktop/ci/artifact-signing.ps1 -Setup
      # Signs the binaries, the uninstaller and the installer (sign-file.ps1).
      - name: Build installer and release metadata
        shell: powershell
        run: apps/flutter/scripts/package-windows.ps1 -ServiceDir build\windows-service -PushAgent target\release\ppvpn-push-agent.exe
      - name: The installer's signer
        if: env.ARTIFACT_SIGNING == 'true'
        shell: powershell
        run: apps/flutter/scripts/check-publisher.ps1 (Get-Item dist\windows\*-setup.exe).FullName
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: desktop-windows-x64
          if-no-files-found: error
          # A release run's packages are not kept long: a stable build's are in the
          # release, a dev build's are for testing. Other builds: the default.
          retention-days: ${{ needs.prepare.outputs.environment && 3 || 0 }}
          path: |
            dist/windows/*-setup.exe
            dist/windows/release-meta-windows-x64.json

  # One DMG and .pkg per architecture of the Flutter app (#401), each built
  # end to end in its own chain of jobs (#459), all on Apple silicon runners;
  # nothing is joined into a universal binary. A merge builds arm64 only
  # (prepare's macos, #459); runs by hand build both. Per architecture:
  #   macos-app      the app (apps/flutter/scripts/ci-build.sh, that slice of
  #                  the library in Flutter's universal bundle) and the push
  #                  agent's client, PPVPNClient (crates/desktop/scripts/build-apple.sh),
  #                  which reuses that build; it needs the backend's address,
  #                  so the environment. The x86_64 job runs the bindings'
  #                  generator, built for x86_64, under Rosetta.
  #   macos-service  the service helpers (tools/desktop/build-service.sh), no
  #                  secret; their profile shares no build with the app's
  #   macos          tools/desktop/ci/build-macos-native.sh thins the bundle,
  #                  signs and packages (apps/flutter/scripts/package-macos.sh)
  macos-app:
    name: macos-app (${{ matrix.arch }})
    needs: [prepare, approve]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.package == 'true' && (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    strategy:
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.macos) }}
    runs-on: macos-15
    environment: ${{ needs.prepare.outputs.environment }}
    timeout-minutes: 90
    env:
      PPVPN_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      PPVPN_VERSION: ${{ needs.prepare.outputs.version }}
      PPVPN_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      MACOS_ARCHS: ${{ matrix.arch }}
      PPVPN_APPLE_TARGETS: ${{ matrix.triple }}
      PPVPN_API_BASE_DEFAULT: ${{ needs.prepare.outputs.channel == 'dev' && secrets.PPVPN_API_BASE || needs.prepare.outputs.channel != 'dev' && vars.PPVPN_API_BASE || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.triple }}
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          targets: ${{ matrix.triple }}
      - uses: ./.github/actions/flutter-toolchain
      # build-apple.sh runs the bindings' generator built for the slice.
      - name: Rosetta
        if: matrix.arch == 'x86_64'
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      # The crates from the cache; Cargo offline from here (#459).
      - uses: ./.github/actions/cargo-home
      # A test-only cargo feature (fault injection, test runtime, lab hooks)
      # never ships: the release graph is refused if one is on.
      - name: No test-only features
        run: |
          tools/release-features-check.sh --target ${{ matrix.triple }} -p ppvpn-flutter
          tools/release-features-check.sh --target ${{ matrix.triple }} -p ppvpn-desktop
      - id: build
        name: Build the app
        run: apps/flutter/scripts/ci-build.sh
      - id: client
        name: Build the push agent's client
        run: crates/desktop/scripts/build-apple.sh
      # The hand-off is what the two builds report writing ($GITHUB_OUTPUT).
      # tar keeps the bundle's framework symlinks, which an artifact drops;
      # the client goes back to the same place in the workspace.
      - name: Pack
        env:
          BUNDLE: ${{ steps.build.outputs.bundle }}
          PACKAGE: ${{ steps.client.outputs.package }}
        run: |
          for out in "$BUNDLE" "$PACKAGE"; do
            [[ -n "$out" && -d "$out" ]] || { echo "error: a build reported no output directory ('$out')" >&2; exit 1; }
          done
          [[ "$PACKAGE" == "$GITHUB_WORKSPACE"/* ]] || { echo "error: $PACKAGE is outside the workspace" >&2; exit 1; }
          mkdir -p build/macos-app
          tar -cf build/macos-app/app.tar -C "$(dirname "$BUNDLE")" "$(basename "$BUNDLE")"
          tar -cf build/macos-app/client.tar -C "$GITHUB_WORKSPACE" "${PACKAGE#"$GITHUB_WORKSPACE"/}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: macos-app-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1
          path: build/macos-app

  macos-service:
    name: macos-service (${{ matrix.arch }})
    needs: [prepare, approve]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.package == 'true' && (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    strategy:
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.macos) }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Baked into the service with the workflow's PPVPN_SPARKLE_PUBLIC_KEY:
      # silent updates install only newer builds (crates/service/src/update.rs).
      PPVPN_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.triple }}
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          targets: ${{ matrix.triple }}
      # The crates from the cache; Cargo offline from here (#459).
      - uses: ./.github/actions/cargo-home
      - name: No test-only features
        run: tools/release-features-check.sh --target ${{ matrix.triple }} --manifest-path crates/service/Cargo.toml
      - name: Build the service helpers
        run: bash tools/desktop/build-service.sh macos-${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: macos-service-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1
          path: build/binaries/*-${{ matrix.triple }}

  macos:
    name: macos (${{ matrix.arch }})
    needs: [prepare, approve, macos-app, macos-service]
    if: >-
      !cancelled() && needs.macos-app.result == 'success' && needs.macos-service.result == 'success'
    strategy:
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.macos) }}
    runs-on: macos-15
    environment: ${{ needs.prepare.outputs.environment }}
    # Packaging (~15 min), then two notarization waits one after the other
    # (the app, then the DMG and pkg together), each up to an hour
    # (tools/notarize.sh): a new team's first submissions are slow.
    timeout-minutes: 150
    env:
      PPVPN_RELEASE_CHANNEL: ${{ needs.prepare.outputs.channel }}
      PPVPN_VERSION: ${{ needs.prepare.outputs.version }}
      PPVPN_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      CI_PROJECT_DIR: ${{ github.workspace }}
      MACOS_ARCHS: ${{ matrix.arch }}
      PPVPN_PREBUILT: 1
      PPVPN_API_BASE_DEFAULT: ${{ needs.prepare.outputs.channel == 'dev' && secrets.PPVPN_API_BASE || needs.prepare.outputs.channel != 'dev' && vars.PPVPN_API_BASE || '' }}
      SPARKLE_PRIVATE_KEY: ${{ needs.prepare.outputs.environment && secrets.SPARKLE_PRIVATE_KEY || '' }}
      # Developer ID Application and Installer, and the notary key (#471);
      # without them the build is ad-hoc signed and not notarized (refused for
      # stable: tools/desktop/ci/build-macos-native.sh).
      MACOS_SIGNING_P12_BASE64: ${{ needs.prepare.outputs.environment && secrets.MACOS_SIGNING_P12_BASE64 || '' }}
      MACOS_SIGNING_P12_PASSWORD: ${{ needs.prepare.outputs.environment && secrets.MACOS_SIGNING_P12_PASSWORD || '' }}
      MACOS_INSTALLER_P12_BASE64: ${{ needs.prepare.outputs.environment && secrets.MACOS_INSTALLER_P12_BASE64 || '' }}
      MACOS_INSTALLER_P12_PASSWORD: ${{ needs.prepare.outputs.environment && secrets.MACOS_INSTALLER_P12_PASSWORD || '' }}
      MACOS_APNS_PROFILE_BASE64: ${{ needs.prepare.outputs.environment && secrets.MACOS_APNS_PROFILE_BASE64 || '' }}
      ASC_KEY_ID: ${{ needs.prepare.outputs.environment && secrets.ASC_KEY_ID || '' }}
      ASC_ISSUER_ID: ${{ needs.prepare.outputs.environment && secrets.ASC_ISSUER_ID || '' }}
      ASC_KEY_P8: ${{ needs.prepare.outputs.environment && secrets.ASC_KEY_P8 || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-app-${{ matrix.arch }}
          path: ${{ runner.temp }}/macos-app
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-service-${{ matrix.arch }}
          path: build/binaries
      - id: unpack
        name: Unpack
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          tar -xf "$RUNNER_TEMP/macos-app/app.tar" -C "$RUNNER_TEMP/bundle"
          tar -xf "$RUNNER_TEMP/macos-app/client.tar"
          chmod 755 build/binaries/*
          # The bundle's name as macos-app packed it.
          bundle="$(tar -tf "$RUNNER_TEMP/macos-app/app.tar" | sed -n 1p)"
          echo "bundle=$RUNNER_TEMP/bundle/${bundle%%/*}" >> "$GITHUB_OUTPUT"
      - name: Build the DMG, pkg and release metadata
        env:
          PPVPN_FLUTTER_BUNDLE: ${{ steps.unpack.outputs.bundle }}
        run: bash tools/desktop/ci/build-macos-native.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: error
          # A release run's packages are not kept long: a stable build's are in the
          # release, a dev build's are for testing. Other builds: the default.
          retention-days: ${{ needs.prepare.outputs.environment && 3 || 0 }}
          path: staging/macos-native

  # The iOS app (#448, #470), on its own: in no GitHub Release and on no
  # update site. A merge builds it unsigned, without any secret, so that a
  # break shows before a release. A stable run (the release and the
  # rehearsal alike), after the approval, signs it for the App Store in
  # desktop-release-stable (the Apple Distribution certificate, the App
  # Store Connect key; tools/desktop/ci/ios-signing.sh) and uploads it to
  # TestFlight, where only the internal testers see it. CFBundleVersion is
  # the release's build number, so each upload is new. A dev run builds
  # nothing for iOS. Its failure stops no other job.
  ios:
    name: ios
    needs: [prepare, approve]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (github.event_name == 'push' || (needs.prepare.outputs.channel == 'stable' && needs.approve.result == 'success'))
    runs-on: macos-15
    environment: ${{ needs.prepare.outputs.channel == 'stable' && 'desktop-release-stable' || '' }}
    timeout-minutes: 90
    env:
      PPVPN_VERSION: ${{ needs.prepare.outputs.version }}
      PPVPN_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      PPVPN_API_BASE_DEFAULT: ${{ needs.prepare.outputs.channel == 'dev' && secrets.PPVPN_API_BASE || needs.prepare.outputs.channel != 'dev' && vars.PPVPN_API_BASE || '' }}
      SIGNED: ${{ needs.prepare.outputs.channel == 'stable' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # App Store Connect takes only apps built with the iOS 26 SDK or later
      # (an 18.5 build was refused at upload, 409). The image's default
      # Xcode is older: the newest Xcode 26 on it, or the job fails here.
      - name: Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          [[ -n "$xcode" ]] || { echo "error: no Xcode 26 on the image" >&2; ls -d /Applications/Xcode*.app >&2; exit 1; }
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-ios
      # The host's for the bridge codegen, which reads the crate; the
      # device's BoringSSL is built from source (btls has no iOS prebuilts).
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          targets: aarch64-apple-darwin
      - uses: ./.github/actions/flutter-toolchain
      # The crates from the cache; Cargo offline from here (#459).
      - uses: ./.github/actions/cargo-home
      # A test-only cargo feature (fault injection, test runtime, lab hooks)
      # never ships: the release graph is refused if one is on.
      - name: No test-only features
        run: tools/release-features-check.sh --target aarch64-apple-ios -p ppvpn-flutter
      - name: Signing
        if: env.SIGNED == 'true'
        env:
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: tools/desktop/ci/ios-signing.sh setup
      - id: build
        name: Build the app
        env:
          FLUTTER_TARGET: ios
          IOS_SDK: device
        run: apps/flutter/scripts/ci-build.sh
      - name: Upload to TestFlight
        if: env.SIGNED == 'true'
        env:
          IPA: ${{ steps.build.outputs.bundle }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          [[ "$IPA" == *.ipa && -f "$IPA" ]] || { echo "error: no IPA ('$IPA')" >&2; exit 1; }
          # altool finds the key in ~/.appstoreconnect/private_keys (ios-signing.sh).
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove the signing keychain and key
        if: always() && env.SIGNED == 'true'
        run: tools/desktop/ci/ios-signing.sh cleanup
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        if: env.SIGNED == 'true'
        with:
          name: ios-ipa
          if-no-files-found: error
          retention-days: 3
          path: ${{ steps.build.outputs.bundle }}

  # The Android app (#448), on its own like iOS: an App Bundle for Google
  # Play, in no GitHub Release and on no update site. A merge builds it
  # signed with the debug key, without any secret, so that a break shows
  # before a release. A stable run (the release and the rehearsal alike),
  # after the approval, signs it with the Play upload key and uploads it to
  # the internal testing track, where only the internal testers see it;
  # versionCode is the release's build number, so each upload is new. Until
  # the upload key and the service account are in desktop-release-stable,
  # a stable run builds it debug-signed and says so (a warning) instead.
  # Play takes a new app's first bundle only through Play Console, by hand:
  # the stable run's bundle is an artifact for that. Release status:
  # vars.PLAY_RELEASE_STATUS (default completed; draft while the app has
  # never been published). A dev run builds nothing for Android. Its
  # failure stops no other job.
  android:
    name: android
    needs: [prepare, approve]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (github.event_name == 'push' || (needs.prepare.outputs.channel == 'stable' && needs.approve.result == 'success'))
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.channel == 'stable' && 'desktop-release-stable' || '' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PPVPN_VERSION: ${{ needs.prepare.outputs.version }}
      PPVPN_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      PPVPN_API_BASE_DEFAULT: ${{ needs.prepare.outputs.channel == 'dev' && secrets.PPVPN_API_BASE || needs.prepare.outputs.channel != 'dev' && vars.PPVPN_API_BASE || '' }}
      STABLE: ${{ needs.prepare.outputs.channel == 'stable' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android,x86_64-linux-android
      # The host's for the bridge codegen, which reads the crate.
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          targets: x86_64-unknown-linux-gnu aarch64-linux-android x86_64-linux-android
      - uses: ./.github/actions/flutter-toolchain
      # The crates from the cache; Cargo offline from here (#459).
      - uses: ./.github/actions/cargo-home
      # A test-only cargo feature (fault injection, test runtime, lab hooks)
      # never ships: the release graph is refused if one is on.
      - name: No test-only features
        run: |
          for target in aarch64-linux-android x86_64-linux-android; do
            tools/release-features-check.sh --target "$target" -p ppvpn-flutter
            tools/release-features-check.sh --target "$target" -p ppvpn-tunnel-host
          done
      # The upload key from its secrets, into the runner's temp directory
      # (removed with the runner); SIGNED says whether the build uses it.
      - name: Upload key
        if: env.STABLE == 'true'
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$ANDROID_UPLOAD_KEYSTORE" ] || [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::no Play upload key or service account in this environment: the App Bundle is debug-signed and not uploaded"
            echo "SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          keystore="$RUNNER_TEMP/upload.jks"
          (umask 077 && base64 -d <<<"$ANDROID_UPLOAD_KEYSTORE" > "$keystore")
          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"
          echo "SIGNED=true" >> "$GITHUB_ENV"
      - id: build
        name: Build the App Bundle
        env:
          FLUTTER_TARGET: android
          ANDROID_FORMAT: aab
          ANDROID_KEYSTORE_PASSWORD: ${{ env.SIGNED == 'true' && secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ env.SIGNED == 'true' && secrets.ANDROID_UPLOAD_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ env.SIGNED == 'true' && secrets.ANDROID_UPLOAD_KEY_PASSWORD || '' }}
        run: |
          # The runner's JDK 17 and newest NDK, as ci.yml's android job.
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          apps/flutter/scripts/ci-build.sh
      - name: Upload to Google Play (internal testing)
        if: env.SIGNED == 'true'
        env:
          AAB: ${{ steps.build.outputs.bundle }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS }}
        run: >-
          tools/desktop/ci/play_upload.py com.peakpassvpn.ppvpn "$AAB" internal
          "$PPVPN_VERSION ($PPVPN_BUILD_NUMBER)"
      - name: Remove the upload key
        if: always() && env.ANDROID_KEYSTORE_FILE != ''
        run: rm -f "$ANDROID_KEYSTORE_FILE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        if: env.STABLE == 'true'
        with:
          name: android-aab
          if-no-files-found: error
          retention-days: 3
          path: ${{ steps.build.outputs.bundle }}

  # The CLI (crates/cli, the binary ppvpn) as tar.gz archives, built by
  # tools/cli/build-release.sh: Linux x86_64 and aarch64, static (musl), and
  # macOS universal. No Windows. The channels are the installers': a merge
  # builds for the production API without any secret; dev builds for the dev
  # backend (an artifact, never published); stable goes into the release
  # beside the installers. A stable run fails unless its version is the
  # CLI's (Cargo.toml).
  cli-linux:
    name: cli-linux (${{ matrix.arch }})
    needs: [prepare, approve]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.package == 'true' && (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    runs-on: ubuntu-latest
    # Only dev reads its environment (its PPVPN_API_BASE); nothing
    # here is signed.
    environment: ${{ needs.prepare.outputs.channel == 'dev' && needs.prepare.outputs.environment || '' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            target: aarch64-unknown-linux-musl
    env:
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PPVPN_API_BASE_DEFAULT: ${{ needs.prepare.outputs.channel == 'dev' && secrets.PPVPN_API_BASE || needs.prepare.outputs.channel != 'dev' && vars.PPVPN_API_BASE || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          targets: ${{ matrix.target }}
      # The crates from the cache; Cargo offline from here (#459).
      - uses: ./.github/actions/cargo-home
      # A test-only cargo feature (fault injection, test runtime, lab hooks)
      # never ships: the release graph is refused if one is on.
      - name: No test-only features
        run: tools/release-features-check.sh --target ${{ matrix.target }} -p ppvpn-cli
      - name: Build the archive
        run: tools/cli/build-release.sh linux ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: cli-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: ${{ needs.prepare.outputs.environment && 3 || 0 }}
          path: dist/cli/*.tar.gz

  cli-macos:
    name: cli-macos
    needs: [prepare, approve]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.package == 'true' && (needs.approve.result == 'success' || needs.approve.result == 'skipped')
    runs-on: macos-15
    # The desktop app's signing certificate (and, for dev, the backend).
    environment: ${{ needs.prepare.outputs.environment }}
    # The build (~22 min), then one notarization wait of up to an hour
    # (tools/notarize.sh).
    timeout-minutes: 100
    env:
      # A merge builds aarch64 only (#459), every run by hand the
      # universal binary.
      TARGETS: ${{ needs.prepare.outputs.cli_macos }}
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PPVPN_API_BASE_DEFAULT: ${{ needs.prepare.outputs.channel == 'dev' && secrets.PPVPN_API_BASE || needs.prepare.outputs.channel != 'dev' && vars.PPVPN_API_BASE || '' }}
      MACOS_SIGNING_P12_BASE64: ${{ needs.prepare.outputs.environment && secrets.MACOS_SIGNING_P12_BASE64 || '' }}
      MACOS_SIGNING_P12_PASSWORD: ${{ needs.prepare.outputs.environment && secrets.MACOS_SIGNING_P12_PASSWORD || '' }}
      # Notarization (App Store Connect API key, #471).
      ASC_KEY_ID: ${{ needs.prepare.outputs.environment && secrets.ASC_KEY_ID || '' }}
      ASC_ISSUER_ID: ${{ needs.prepare.outputs.environment && secrets.ASC_ISSUER_ID || '' }}
      ASC_KEY_P8: ${{ needs.prepare.outputs.environment && secrets.ASC_KEY_P8 || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: ${{ needs.prepare.outputs.cli_macos }}
      - uses: ./.github/actions/prebuilt-boringssl
        with:
          targets: ${{ needs.prepare.outputs.cli_macos }}
      # The crates from the cache; Cargo offline from here (#459).
      - uses: ./.github/actions/cargo-home
      # A test-only cargo feature (fault injection, test runtime, lab hooks)
      # never ships: the release graph is refused if one is on.
      - name: No test-only features
        run: |
          args=()
          for target in $TARGETS; do args+=(--target "$target"); done
          tools/release-features-check.sh "${args[@]}" -p ppvpn-cli
      - name: Build the archive
        run: |
          # shellcheck disable=SC2086 # the targets, one word each
          tools/cli/build-release.sh macos $TARGETS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: cli-macos
          if-no-files-found: error
          retention-days: ${{ needs.prepare.outputs.environment && 3 || 0 }}
          path: dist/cli/*.tar.gz

  # Stable only (a dev build ends with the package jobs' artifacts). The
  # release's files: the rpms signed, then everything
  # checked as a whole before anything is published:
  # all five platforms, each installer against its metadata, the update
  # signatures, the tag, and that the channel does not go back.
  release-files:
    name: release-files
    if: inputs.channel == 'stable' && needs.prepare.outputs.publish == 'true'
    needs: [prepare, approve, linux, linux-smoke, linux-repo, windows, macos, cli-linux, cli-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # For the package repositories' signing key, which signs the rpms here.
    environment: desktop-release-stable
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      CHANNEL: stable
      SITE_BASE: ${{ vars.DESKTOP_SITE_BASE }}
      ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            tools/desktop/ci
            apps/flutter/packaging/linux
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          path: artifacts
      # The CLI's archives: in the release (its SHA256SUMS and provenance),
      # not in the update site, which takes only the installers' metadata.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          path: artifacts
      - name: Collect
        run: |
          set -eu
          mkdir release
          find artifacts -type f | while read -r file; do
            name=$(basename "$file")
            [ ! -e "release/$name" ] || { echo "two artifacts carry $name" >&2; exit 1; }
            mv "$file" "release/$name"
          done
          ls -l release
      # The rpm becomes a release asset signed: the dnf repository points at
      # the asset. Signing changes the file, so its metadata is rewritten
      # here, before the checks, the checksums and the provenance below.
      # The key must be the one whose public half the packages ship
      # (packaging/ppvpn.asc), which clients already trust.
      - name: Sign the rpms
        env:
          PKG_GPG_PRIVATE_KEY: ${{ secrets.PPVPN_PKG_GPG_PRIVATE_KEY }}
          PKG_GPG_PASSPHRASE: ${{ secrets.PPVPN_PKG_GPG_PASSPHRASE }}
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm gnupg jq
          PKG_GPG_FINGERPRINT=$(gpg --show-keys --with-colons apps/flutter/packaging/linux/ppvpn.asc | awk -F: '$1 == "fpr" { print $10; exit }')
          [ -n "$PKG_GPG_FINGERPRINT" ] || { echo "no fingerprint in packaging/ppvpn.asc" >&2; exit 1; }
          export PKG_GPG_FINGERPRINT
          tools/desktop/ci/sign-linux-rpms.sh release
      - name: The channel's published pointer
        id: current
        run: |
          set -eu
          if [ -z "$SITE_BASE" ]; then
            echo "the variable DESKTOP_SITE_BASE (the update site's https address) is not set" >&2
            exit 1
          fi
          # 200: compare against it. 404: the channel has no release yet.
          # Anything else is an error, not "no release".
          status=$(curl -sS -o current.json -w '%{http_code}' "${SITE_BASE%/}/desktop/channels/$CHANNEL.json")
          case "$status" in
            200) echo "args=--current current.json" >>"$GITHUB_OUTPUT" ;;
            404) echo "args=" >>"$GITHUB_OUTPUT" ;;
            *) echo "the update site answered $status for the channel pointer" >&2; exit 1 ;;
          esac
      - name: Check the release; generate its pointer and feeds
        env:
          CURRENT: ${{ steps.current.outputs.args }}
        run: |
          set -eu
          downgrade=""
          [ "$ALLOW_DOWNGRADE" != true ] || downgrade=--allow-downgrade
          # shellcheck disable=SC2086
          python3 tools/desktop/ci/update_site.py build --assets release --tag "$TAG" --channel "$CHANNEL" \
            --download-base "https://github.com/$GITHUB_REPOSITORY/releases/download" \
            --site-base "$SITE_BASE" --out site --installers-on-site $CURRENT $downgrade
      - name: SHA256SUMS
        run: cd release && sha256sum -- * >../SHA256SUMS && mv ../SHA256SUMS . && cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: release-files
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: site-preview
          path: site/
          if-no-files-found: error

  publish:
    name: publish
    # Attest that this workflow built the files, then publish them. A file
    # uploaded to the release by hand fails `gh attestation verify`.
    # A rehearsal attests nothing (the log of attestations is public) and
    # leaves a draft release, which has no tag and which only the
    # repository's members can see.
    needs: [prepare, approve, release-files]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: desktop-release-stable
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD: ${{ needs.prepare.outputs.build_number }}
      REHEARSAL: ${{ inputs.rehearsal }}
      ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !inputs.rehearsal }}
        with:
          subject-path: release/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Releases are immutable: a tag is published once. A rehearsal's
          # draft of the same version is replaced, by the next rehearsal and
          # by the release itself (a draft has no tag and nobody sees it; the
          # rehearsal before v0.6.0 left one that refused the release);
          # anything published stays, and so does a draft not made here.
          if existing=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,name --jq '"\(.isDraft) \(.name)"' 2>/dev/null); then
            case "$existing" in
              "true PPVPN $VERSION (rehearsal, build "*")")
                # Deletes the draft only: the tag is left as it is.
                gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
                echo "replaced a rehearsal's draft of $TAG: ${existing#true }" >&2
                ;;
              *)
                echo "the release $TAG already exists" >&2
                exit 1
                ;;
            esac
          fi
          notes="PPVPN $VERSION (build $BUILD), stable channel: the desktop installers and the CLI's archives. Commit \`$GITHUB_SHA\`. Verify a file with \`sha256sum -c SHA256SUMS\` and \`gh attestation verify <file> --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml\`."
          if [ "$REHEARSAL" = true ]; then
            # A draft: no tag is created, and it is not public. To be deleted
            # after the rehearsal (gh release delete "$TAG").
            # No --target: naming a commit made the API refuse the workflow's
            # token (403), as it does for a tag on a commit that changes
            # workflow files; a draft makes no tag, so it needs none.
            url=$(gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" \
              --draft --latest=false --title "PPVPN $VERSION (rehearsal, build $BUILD)" \
              --notes "Rehearsal of the release workflow at commit $GITHUB_SHA. Not a release. $notes")
            echo "Draft release (delete it after the rehearsal): $url" >>"$GITHUB_STEP_SUMMARY"
          else
            # On the tag it runs on. The repository's latest release, unless
            # it may be a rollback (allow_downgrade): an older version must
            # not take that place from a newer one.
            latest=true
            [ "$ALLOW_DOWNGRADE" != true ] || latest=false
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --latest="$latest" --title "PPVPN $VERSION" --notes "$notes"
          fi

  # The update site: the stable channel's pointer and Sparkle feeds
  # (desktop/…) and its apt and dnf repositories (linux/…). The whole site is
  # rebuilt from the GitHub Releases on every run, so the releases are its
  # only source and a site run restores it; site-deploy then uploads it to
  # the R2 bucket served at DESKTOP_SITE_BASE. Only the stable channel is
  # built; the retired dev channel's update checks are pointed at it. A
  # rehearsal uploads nothing: the site is built from the rehearsal's own
  # files and kept three days as the artifact site, as a release's is.
  site:
    name: site
    if: >-
      !cancelled() && needs.approve.result == 'success' &&
      (inputs.channel == 'site' || (inputs.channel == 'stable' && needs.publish.result == 'success'))
    needs: [prepare, approve, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The package repositories' signing key signs the apt and dnf indexes.
    environment: desktop-release-stable
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      SITE_BASE: ${{ vars.DESKTOP_SITE_BASE }}
      DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download
      # Releases whose deb stays installable from the apt repository.
      KEEP: '5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            tools/desktop/ci
            apps/flutter/packaging/linux
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends apt-utils createrepo-c rpm gnupg gpgv jq
      # Stable releases are the tags vX.Y.Z that are not prereleases, from
      # v0.6.0 on: v0.5.21 and before are the Go core's releases, which
      # carry no installer. "Newest" is the highest version, not the latest
      # published: a release published again later must not move the
      # channel back.
      - name: The stable releases, newest first
        if: ${{ !inputs.rehearsal }}
        run: |
          set -eu
          if [ -z "$SITE_BASE" ]; then
            echo "the variable DESKTOP_SITE_BASE (the update site's https address) is not set" >&2
            exit 1
          fi
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isPrerelease,isDraft \
            --jq '.[] | select(.isDraft or .isPrerelease | not) | .tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | awk -F. '{ major = substr($1, 2) + 0 } major > 0 || $2 + 0 >= 6' \
            | sort -V -r | head -n "$KEEP" > tags || true
          if [ ! -s tags ]; then
            echo "no stable release from v0.6.0 on: nothing to upload" >&2
            exit 1
          fi
          cat tags
      # The newest release's macOS and Windows installers are copied into the
      # site, which the Sparkle feeds' enclosures name (update_site.py
      # --installers-on-site): pkg is CDN-cached, GitHub's release downloads
      # are slow from some networks. So are the macOS .pkg files, which the
      # privileged service installs silently when the release signed them
      # (#548). The release's assets stay as they are.
      - name: Download their Linux packages, and the newest release's metadata and installers
        if: ${{ !inputs.rehearsal }}
        run: |
          set -eu
          while read -r tag; do
            mkdir -p "linux-releases/$tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "linux-releases/$tag" \
              --pattern 'release-meta-linux-x64-*.json' --pattern '*.deb' --pattern '*.rpm'
          done < tags
          newest=$(head -n 1 tags)
          mkdir newest
          gh release download "$newest" --repo "$GITHUB_REPOSITORY" --dir newest \
            --pattern 'release-meta-*.json' --pattern '*.dmg' --pattern '*.pkg' --pattern '*-setup.exe'
          echo "NEWEST=$newest" >> "$GITHUB_ENV"
      # A rehearsal's files come from the calling run, laid out as the one
      # release there is.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ inputs.rehearsal }}
        with:
          name: release-files
          path: rehearsal-release
      - name: The rehearsal's release
        if: ${{ inputs.rehearsal }}
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -eu
          if [ -z "$SITE_BASE" ]; then
            echo "the variable DESKTOP_SITE_BASE (the update site's https address) is not set" >&2
            exit 1
          fi
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a stable tag name: $TAG" >&2; exit 1; }
          echo "$TAG" > tags
          mkdir -p "linux-releases/$TAG" newest "sums/$TAG"
          cp rehearsal-release/release-meta-linux-x64-*.json rehearsal-release/*.deb rehearsal-release/*.rpm "linux-releases/$TAG/"
          cp rehearsal-release/release-meta-*.json rehearsal-release/*.dmg rehearsal-release/*.pkg rehearsal-release/*-setup.exe newest/
          cp rehearsal-release/SHA256SUMS "sums/$TAG/SHA256SUMS"
          echo "NEWEST=$TAG" >> "$GITHUB_ENV"
      # The site redistributes only what the release workflow produced: every
      # downloaded file must be in its release's SHA256SUMS with that hash,
      # and carry build provenance signed by release.yml in this
      # repository. One failure and nothing is deployed.
      # (A rehearsal has no provenance: its files are checked against its
      # SHA256SUMS only.)
      - name: Verify the downloads
        env:
          REHEARSAL: ${{ inputs.rehearsal }}
        run: |
          set -eu
          verify() {   # tag, directory
            sums="sums/$1/SHA256SUMS"
            mkdir -p "sums/$1"
            [ -f "$sums" ] || gh release download "$1" --repo "$GITHUB_REPOSITORY" --dir "sums/$1" --pattern SHA256SUMS
            for file in "$2"/*; do
              name=$(basename "$file")
              listed=$(awk -v name="$name" '$2 == name || $2 == "*" name { print $1 }' "$sums")
              [ -n "$listed" ] || { echo "$1: $name is not in SHA256SUMS" >&2; exit 1; }
              [ "$listed" = "$(sha256sum "$file" | cut -d' ' -f1)" ] || { echo "$1: $name does not have its SHA256SUMS hash" >&2; exit 1; }
              if [ "$REHEARSAL" != true ]; then
                gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
                  --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" >/dev/null \
                  || { echo "$1: $name has no provenance from release.yml" >&2; exit 1; }
              fi
              echo "verified $1/$name"
            done
            if [ "$REHEARSAL" != true ]; then
              gh attestation verify "$sums" --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" >/dev/null \
                || { echo "$1: SHA256SUMS has no provenance from release.yml" >&2; exit 1; }
            fi
          }
          while read -r tag; do verify "$tag" "linux-releases/$tag"; done < tags
          verify "$NEWEST" newest
      - name: Pointer and feeds
        run: |
          set -eu
          python3 tools/desktop/ci/update_site.py build --assets newest --tag "$NEWEST" --channel stable \
            --download-base "$DOWNLOAD_BASE" --site-base "$SITE_BASE" --out site --installers-on-site
          python3 tools/desktop/ci/update_site.py check site/desktop/channels/stable.json --channel stable
      - name: apt and dnf repositories
        env:
          PKG_GPG_PRIVATE_KEY: ${{ secrets.PPVPN_PKG_GPG_PRIVATE_KEY }}
          PKG_GPG_PASSPHRASE: ${{ secrets.PPVPN_PKG_GPG_PASSPHRASE }}
        run: |
          set -eu
          # The key must be the one whose public half the packages ship.
          PKG_GPG_FINGERPRINT=$(gpg --show-keys --with-colons apps/flutter/packaging/linux/ppvpn.asc | awk -F: '$1 == "fpr" { print $10; exit }')
          [ -n "$PKG_GPG_FINGERPRINT" ] || { echo "no fingerprint in packaging/ppvpn.asc" >&2; exit 1; }
          export PKG_GPG_FINGERPRINT
          # --published: a setup package the site already has under the same name is kept as
          # published (linux/setup/ is immutable; the release rpm is signed anew each release).
          tools/desktop/ci/build-linux-repo.sh --channel stable --releases linux-releases \
            --download-base "$DOWNLOAD_BASE" --site-base "$SITE_BASE" --out site --keep "$KEEP" \
            --published "$SITE_BASE"
      # The dev channel is retired (dev builds are never published), but
      # earlier dev installs still poll its files: the Linux app
      # linux/dev/latest.json, the macOS and Windows apps
      # desktop/dev/appcast-<platform>.xml. They get stable's, so that they
      # are offered the stable release. Nothing else of dev is written: the
      # apt suite dev and the dnf repository linux/rpm/dev are left as they
      # are in the bucket (site-deploy deletes nothing).
      - name: Point the retired dev channel at stable
        run: |
          set -eu
          mkdir -p site/linux/dev site/desktop/dev
          cp site/linux/stable/latest.json site/linux/dev/latest.json
          for feed in site/desktop/stable/appcast-*.xml; do
            cp "$feed" "site/desktop/dev/$(basename "$feed")"
          done
      - name: The site
        run: |
          set -eu
          # One version in the pointer, the feeds and the Linux update check.
          version=$(jq -er .version site/desktop/channels/stable.json)
          [ "$(jq -er .version site/linux/stable/latest.json)" = "$version" ] \
            || { echo "latest.json and the channel pointer name different versions" >&2; exit 1; }
          find site -type f | sort
          du -sh site
          # The order and the caching site-deploy uploads it with.
          tools/desktop/ci/upload-site.sh --plan site
      # What site-deploy uploads; for a rehearsal, all there is.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: site
          path: site
          if-no-files-found: error
          retention-days: 3
      - name: Rehearsal summary
        if: ${{ inputs.rehearsal }}
        run: |
          echo "The site was built and not uploaded. It is the artifact site of this run." >>"$GITHUB_STEP_SUMMARY"

  # The upload, in its own job: the bucket's keys are not in the job that
  # holds the signing key, and the reverse. The site is uploaded over what
  # the bucket holds, in an order safe for a client reading it meanwhile
  # (tools/desktop/ci/upload-site.sh): the files that never change first
  # (packages, by-hash indexes, repodata), then the indexes that name them,
  # the signed ones, and the update checks and the channel pointer last.
  # Nothing is deleted, so whatever an index already fetched names is still
  # there. R2's S3 API with the AWS CLI of the runner image.
  site-deploy:
    name: site-deploy
    if: ${{ !cancelled() && !inputs.rehearsal && needs.approve.result == 'success' && needs.site.result == 'success' }}
    needs: [approve, site]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The bucket's keys.
    environment: desktop-release-stable
    env:
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.PPVPN_PKG_R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.PPVPN_PKG_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PPVPN_PKG_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # Checksums only where an operation requires one: what Cloudflare
      # advises for R2 with recent AWS CLIs, which add them by default.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/desktop/ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site
      - name: Upload to R2
        run: tools/desktop/ci/upload-site.sh site
      - name: Summary
        env:
          SITE_BASE: ${{ vars.DESKTOP_SITE_BASE }}
        run: |
          echo "The update site was uploaded: ${SITE_BASE%/}/desktop/channels/stable.json" >>"$GITHUB_STEP_SUMMARY"

  # The rehearsal's check of the bucket, after the approval and with its
  # keys: read only (upload-site.sh --check lists the bucket, compares the
  # immutable files as an upload would and lists what an upload would
  # overwrite). The keys' write access is first used by a real release.
  site-check:
    name: site-check
    if: ${{ !cancelled() && inputs.rehearsal && needs.approve.result == 'success' && needs.site.result == 'success' }}
    needs: [approve, site]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: desktop-release-stable
    env:
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.PPVPN_PKG_R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.PPVPN_PKG_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.PPVPN_PKG_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/desktop/ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site
      - name: Check against R2 (read only)
        # bash, not the default `bash -e`: with pipefail a refusal of the
        # script fails the step rather than vanishing into tee's status.
        shell: bash
        run: tools/desktop/ci/upload-site.sh --check site | tee check.txt
      - name: Summary
        run: |
          { echo '```'; grep -v '^[0-9]  ' check.txt || true; echo '```'; } >>"$GITHUB_STEP_SUMMARY"

  # The installers for the website's download buttons, and for the update
  # feed of the applications before 0.6.0: both go to the backend, which
  # reads a private R2 bucket on every request (the release objects and one
  # pointer per platform; tools/desktop/ci/upload-downloads.sh). The files
  # are the release's own (the artifact release-files), uploaded after the
  # GitHub release exists; the pointers move last. Nothing is registered
  # with the backend: moving the pointers is what makes the website serve
  # this version.
  downloads-deploy:
    name: downloads-deploy
    if: ${{ !cancelled() && !inputs.rehearsal && inputs.channel == 'stable' && needs.approve.result == 'success' && needs.publish.result == 'success' }}
    needs: [prepare, approve, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The bucket's keys.
    environment: desktop-release-stable
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD: ${{ needs.prepare.outputs.build_number }}
      CHANNEL: stable
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_CLIENT_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/desktop/ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release
      - name: Upload to R2
        run: tools/desktop/ci/upload-downloads.sh release
      - name: Summary
        run: |
          echo "The website's downloads now serve $VERSION (build $BUILD)." >>"$GITHUB_STEP_SUMMARY"

  # The rehearsal's check of that bucket, after the approval and with its
  # keys: read only (upload-downloads.sh --check verifies the files against
  # their release-meta, lists the keys an upload would write and says what
  # each pointer names now). The keys' write access is first used by a real
  # release.
  downloads-check:
    name: downloads-check
    if: ${{ !cancelled() && inputs.rehearsal && inputs.channel == 'stable' && needs.approve.result == 'success' && needs.publish.result == 'success' }}
    needs: [prepare, approve, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: desktop-release-stable
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD: ${{ needs.prepare.outputs.build_number }}
      CHANNEL: stable
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_CLIENT_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/desktop/ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: release
      - name: Check against R2 (read only)
        # bash, not the default `bash -e`: with pipefail a refusal of the
        # script fails the step rather than vanishing into tee's status.
        shell: bash
        run: tools/desktop/ci/upload-downloads.sh --check release | tee check.txt
      - name: Summary
        run: |
          { echo '```'; cat check.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"

  # ---- On a merge only: the build caches ci.yml restores. One job per
  # ci.yml cache key (shared-key), building what the ci.yml jobs on that key
  # build, so that a pull request after a dependency change does not build
  # sail cold. rust-cache keeps the dependencies only; ci.yml never saves.
  # The key hashes the toolchain, the CARGO*/RUST*/CC* environment and the
  # manifests and lock file, so a job runs only when the merge changed one
  # of those (`lock`) or its key is missing on main (the repository's 20 GB
  # evicts the least recently used), and then looks its exact key up first:
  # it builds, from scratch, and saves only on a miss. Not for a missing key
  # while the caches are over 19 GB: rebuilding one would evict another.
  # The keys: macos, windows, flutter and tunnel (#459), linux and desktop.
  # A workflow change that alters what a key's jobs build, without a lock
  # change, keeps the old entry: delete it (gh cache delete <key>; gh cache
  # list --key v1-rust-macos- lists them) and the next merge rebuilds it as
  # missing. All of them at once: a new prefix-key (here and in ci.yml).
  # The changes job deletes main's Rust entries no key uses any more (another
  # prefix-key, or a family's older entries once a newer one is saved):
  # left to the LRU they kept the caches over the guard, so the new keys were
  # never built (#496's merge, 7.9 GB of v0-rust-* left). It also deletes
  # main's CodeQL overlay databases but the newest per language (default
  # setup leaves about ten each), and the entries of closed pull requests
  # (a PR's caches are only its own; after the merge main saves its own).
  changes:
    name: changes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Deletes the cache entries nothing uses (see above).
      actions: write
      # Whether a pull request with caches is closed.
      pull-requests: read
    outputs:
      lock: ${{ steps.diff.outputs.lock }}
      missing: ${{ steps.caches.outputs.missing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: tools/ci-changes.sh >> "$GITHUB_OUTPUT"
      # The keys rust-cache made on main, by prefix (v1-rust-<shared-key>-<OS>);
      # `missing` lists the absent ones between spaces.
      - id: caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Main's Rust entries no key uses: another prefix-key than v1-rust,
          # or not a family's newest (v1-rust-<shared-key>-<OS>-<arch>, newest
          # first). Before the usage is read, so their space counts as free.
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?ref=refs/heads/main&per_page=100&sort=created_at&direction=desc" \
            --jq '.actions_caches[] | select(.key | test("^v[0-9]+-rust-")) | "\(.id) \(.key)"' |
            while read -r id key; do
              family=$(cut -d- -f1-5 <<<"$key")
              if [[ $key != v1-rust-* ]] || grep -qxF "$family" "$RUNNER_TEMP/families" 2>/dev/null; then
                echo "deleting the unused cache entry $key"
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" --silent
              else
                echo "$family" >> "$RUNNER_TEMP/families"
              fi
            done
          # CodeQL overlay databases on main: the newest per language
          # (codeql-overlay-base-database-<n>-<hash>-<language>-...).
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?ref=refs/heads/main&key=codeql-overlay-base-database-&per_page=100&sort=created_at&direction=desc" \
            --jq '.actions_caches[] | "\(.id) \(.key)"' |
            while read -r id key; do
              family=$(cut -d- -f5-7 <<<"$key")
              if grep -qxF "$family" "$RUNNER_TEMP/codeql" 2>/dev/null; then
                echo "deleting the older CodeQL entry $key"
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" --silent
              else
                echo "$family" >> "$RUNNER_TEMP/codeql"
              fi
            done
          # Closed pull requests' entries.
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.ref | startswith("refs/pull/")) | "\(.id) \(.ref)"' |
            while read -r id ref; do
              pr=$(cut -d/ -f3 <<<"$ref")
              state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .state) || state=unknown
              if [ "$state" = closed ]; then
                echo "deleting cache entry $id of closed #$pr"
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" --silent
              fi
            done
          used=$(gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" --jq .active_caches_size_in_bytes)
          keys=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?ref=refs/heads/main&key=v1-rust-&per_page=100" \
            --jq '.actions_caches[].key')
          missing=" "
          for want in macos-Darwin tunnel-Darwin windows-Windows_NT flutter-Linux linux-Linux desktop-Linux; do
            grep -q "^v1-rust-$want-" <<<"$keys" || missing="$missing$want "
          done
          echo "cache usage: $((used / 1048576)) MiB; missing:$missing"
          if [ "$used" -gt $((19000 * 1048576)) ]; then
            echo "::warning::Actions caches at $((used / 1048576)) MiB: missing keys are not rebuilt"
            missing=" "
          fi
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

  # Downloads, so that builds do not depend on a registry answering (#459):
  # the release builds' crates (.github/actions/cargo-home: every target's
  # crates and git dependencies) and the modules of ci.yml's Go helpers
  # (.github/actions/go-modules), one entry each for Linux and macOS and one
  # each for Windows, made when Cargo.lock or test/go.sum changes. A lookup
  # when the entry is there, so on every merge. The keys hash Cargo.lock and
  # test/go.sum, so the checkout is LF as in the jobs that restore them: a
  # CRLF one on Windows saved entries under keys no job looks up.
  cache-downloads:
    name: cache-downloads (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: LF checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
      - uses: ./.github/actions/cargo-home
        with:
          lookup-only: 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: test/go.mod
          cache: false
      - uses: ./.github/actions/go-modules
        with:
          lookup-only: 'true'

  # macos, flutter (macos-15) and ios: one key, macos, which the three
  # restore, built in one job, so that what they share (the registry, the
  # codegen's cargo expand, build scripts and proc-macros, the client crate
  # for Apple silicon) is in it once. In the order the jobs build.
  cache-macos:
    name: cache-macos
    needs: changes
    if: needs.changes.outputs.lock == 'true' || contains(needs.changes.outputs.missing, ' macos-Darwin ')
    runs-on: macos-15
    timeout-minutes: 180
    env:
      # ci-build.sh refuses an empty backend; what a release passes (#518).
      PPVPN_API_BASE_DEFAULT: ${{ vars.PPVPN_API_BASE }}
      # As in ci.yml: part of the cache key.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios-sim
      # The key looked up only; on a miss the build below fills it from
      # scratch and the post step saves it.
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          shared-key: macos
          lookup-only: true
      - uses: ./.github/actions/prebuilt-boringssl
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          targets: aarch64-apple-darwin x86_64-apple-darwin
      - uses: ./.github/actions/flutter-toolchain
        if: steps.cache.outputs.cache-hit != 'true'
      - name: what macos builds
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo clippy --workspace --all-targets --locked
          cargo check --locked -p btls-sys --target x86_64-apple-darwin
          # The same cargo invocation as ci.yml's macos tests: another
          # combination of packages unifies features differently and its
          # artifacts would not be reused.
          cargo test --locked --no-run -p ppvpn-core -p ppvpn-cli -p ppvpn-desktop -p ppvpn-service \
            --lib --bin ppvpn-service --test keystore
          (cd crates/desktop && for t in aarch64-apple-darwin x86_64-apple-darwin; do cargo build --lib --locked --target "$t"; done)
      - name: what flutter (macos-15) builds
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          PPVPN_APPLE_TARGETS: aarch64-apple-darwin
        run: |
          apps/flutter/scripts/ci-build.sh
          # Package (macOS): bootstrap.sh's client package, then the helpers.
          crates/desktop/scripts/build-apple.sh apps/macos/PPVPNClient --debug
          cargo build --locked -p ppvpn-service --bins --target aarch64-apple-darwin
      # ci-build.sh makes the platform runner in apps/flutter (flutter
      # create): the iOS one from a clean tree, as in ci.yml.
      - name: what ios builds
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          FLUTTER_TARGET: ios
          IOS_SDK: simulator
        run: |
          git clean -ffdxq apps/flutter && git checkout -- apps/flutter
          apps/flutter/scripts/ci-build.sh

  # tunnel (ios): a key of its own, as the mobile profile's artifacts are
  # of no use to the other macOS jobs.
  cache-tunnel:
    name: cache-tunnel
    needs: changes
    if: needs.changes.outputs.lock == 'true' || contains(needs.changes.outputs.missing, ' tunnel-Darwin ')
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # As in ci.yml: part of the cache key.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-ios
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          shared-key: tunnel
          lookup-only: true
      - name: what tunnel (ios) builds
        if: steps.cache.outputs.cache-hit != 'true'
        run: crates/tunnel-host/scripts/build-xcframework.sh "$RUNNER_TEMP/tunnel" ios

  # windows and flutter (windows-latest): one key, windows.
  cache-windows:
    name: cache-windows
    needs: changes
    if: needs.changes.outputs.lock == 'true' || contains(needs.changes.outputs.missing, ' windows-Windows_NT ')
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      # ci-build.sh refuses an empty backend; what a release passes (#518).
      PPVPN_API_BASE_DEFAULT: ${{ vars.PPVPN_API_BASE }}
      # As in ci.yml: part of the cache key.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: 0
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    defaults:
      run:
        shell: bash
    steps:
      - name: LF checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy
          targets: x86_64-pc-windows-msvc
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          shared-key: windows
          lookup-only: true
      - uses: ./.github/actions/prebuilt-boringssl
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          targets: x86_64-pc-windows-msvc
      - uses: ./.github/actions/flutter-toolchain
        if: steps.cache.outputs.cache-hit != 'true'
      - name: what windows builds
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo clippy -p ppvpn-core -p ppvpn-account -p ppvpn-desktop -p ppvpn-engine-host -p ppvpn-service \
            -p ppvpn-flutter -p ppvpn-push-agent --all-targets --locked --target x86_64-pc-windows-msvc
          # As ci.yml's windows job runs them, one package at a time.
          cargo test -p ppvpn-core --lib --locked --target x86_64-pc-windows-msvc --no-run
          cargo test -p ppvpn-desktop --lib --locked --target x86_64-pc-windows-msvc --no-run
          cargo test -p ppvpn-push-agent --locked --target x86_64-pc-windows-msvc --no-run
          cargo build -p ppvpn-desktop --lib --locked --target x86_64-pc-windows-msvc
          cargo test -p ppvpn-core --lib --features fault-injection --locked --target x86_64-pc-windows-msvc --no-run
      - name: what flutter (windows-latest) builds
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          apps/flutter/scripts/ci-build.sh
          # Installer (Windows): package-windows.ps1's service, with the
          # step's profile overrides.
          CARGO_PROFILE_SERVICE_LTO=false CARGO_PROFILE_SERVICE_CODEGEN_UNITS=16 \
            cargo build --locked -p ppvpn-service --profile service --target x86_64-pc-windows-msvc

  # flutter (ubuntu-latest) and android: one key, flutter. The codegen's
  # cargo expand, build scripts and proc-macros are the same for both.
  cache-flutter-linux:
    name: cache-flutter-linux
    needs: changes
    if: needs.changes.outputs.lock == 'true' || contains(needs.changes.outputs.missing, ' flutter-Linux ')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # ci-build.sh refuses an empty backend; what a release passes (#518).
      PPVPN_API_BASE_DEFAULT: ${{ vars.PPVPN_API_BASE }}
      # As in ci.yml: part of the cache key.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android,x86_64-linux-android
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          shared-key: flutter
          lookup-only: true
      - uses: ./.github/actions/prebuilt-boringssl
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          targets: x86_64-unknown-linux-gnu aarch64-linux-android x86_64-linux-android
      - name: Linux build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config \
            libgtk-3-dev libx11-dev libxi-dev
      - uses: ./.github/actions/flutter-toolchain
        if: steps.cache.outputs.cache-hit != 'true'
      - name: what flutter (ubuntu-latest) builds
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          apps/flutter/scripts/ci-build.sh
          # Enhanced mode end to end and the Linux packages.
          cargo build --locked -p ppvpn-service --profile service --bins
      # The Android runner from a clean tree, as in ci.yml.
      - name: what android builds
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          FLUTTER_TARGET: android
        run: |
          git clean -ffdxq apps/flutter && git checkout -- apps/flutter
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          apps/flutter/scripts/ci-build.sh

  # lint, unit, integration and linux: one key, linux. Not the memory steps'
  # release builds of ne-mem (only when Cargo.lock or the harness changed).
  cache-linux:
    name: cache-linux
    needs: changes
    if: needs.changes.outputs.lock == 'true' || contains(needs.changes.outputs.missing, ' linux-Linux ')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # As in ci.yml: part of the cache key.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          shared-key: linux
          lookup-only: true
      - uses: ./.github/actions/prebuilt-boringssl
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          targets: x86_64-unknown-linux-gnu
      - name: what lint, unit, integration and linux build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo clippy --all-targets --locked
          cargo test --locked --no-run
          cargo test --locked -p ppvpn-cli --test keystore --no-run
          # tools/test-system-linux.sh
          cargo test -p ppvpn-core --lib --no-run --locked --features fault-injection
          cargo build -p ppvpn-core-lab --locked
          (cd crates/service && cargo build --locked --bin ppvpn-service)
          (cd crates/desktop && cargo clippy --locked --features linux-e2e --all-targets)
          (cd crates/desktop && cargo test --locked --features linux-e2e --lib --no-run)

  # desktop: a key of its own, as its CARGO_BUILD_TARGET is part of the key.
  # Not the binding scripts' builds (uniffi-bindgen-cs, Swift).
  cache-desktop:
    name: cache-desktop
    needs: changes
    if: needs.changes.outputs.lock == 'true' || contains(needs.changes.outputs.missing, ' desktop-Linux ')
    # As ci.yml's desktop job.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # As in ci.yml: part of the cache key.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.98.1
          components: clippy
          targets: x86_64-unknown-linux-gnu
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          shared-key: desktop
          lookup-only: true
      - uses: ./.github/actions/prebuilt-boringssl
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          targets: x86_64-unknown-linux-gnu
      - name: what desktop builds
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          (cd crates/service && cargo test --locked --no-run && cargo clippy --locked --all-targets)
          (cd crates/desktop && cargo test --locked --no-run && cargo clippy --locked --all-targets)
          cargo test --locked -p ppvpn-push-agent --no-run
          cargo clippy --locked -p ppvpn-flutter -p ppvpn-push-agent --all-targets
          cargo test --locked -p ppvpn-tunnel-host --no-run
          cargo clippy --locked -p ppvpn-tunnel-host --all-targets
